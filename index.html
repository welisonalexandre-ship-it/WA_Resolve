function formatarDataBR(dataIso) {
  if (!dataIso) return "-";
  const partes = String(dataIso).split("T")[0].split("-");
  if (partes.length === 3) {
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  return dataIso;
}

function formatBRL(valor) {

function getNextShortOrderId() {

  orders.forEach(o => {

}

// Compressão inteligente de foto
function compressAndResizeImage(file, maxWidth = 1000, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
}

// Geração de BR Code / EMV PIX padrão Banco Central
function crc16(str) {
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) {
        crc = (crc << 1) ^ 0x1021;
      } else {
        crc = crc << 1;
      }
    }
  }
  let hex = (crc & 0xFFFF).toString(16).toUpperCase();
  return hex.padStart(4, "0");
}

function emvField(id, val) {
  const v = String(val);
  const len = String(v.length).padStart(2, "0");
  return `${id}${len}${v}`;
}

function gerarPixPayload(chave, valor, beneficiario = "WA RESOLVE", cidade = "MOSSORO", txid = "***") {
  if (!chave) return "";
  const cleanPix = chave.trim();
  const accInfo = emvField("00", "BR.GOV.BCB.PIX") + emvField("01", cleanPix);
  
  let payload = 
    emvField("00", "01") + 
    emvField("26", accInfo) + 
    emvField("52", "0000") + 
    emvField("53", "986");

  if (Number(valor) > 0) {
    payload += emvField("54", Number(valor).toFixed(2));
  }

  const cleanName = beneficiario.normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 25);
  const cleanCity = cidade.normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 15);

  payload += 
    emvField("58", "BR") + 
    emvField("59", cleanName) + 
    emvField("60", cleanCity) + 
    emvField("62", emvField("05", txid)) + 
    "6304";

  return payload + crc16(payload);
}

        status: d.status || (Number(d.orcamento) > 0 ? "Aguardando aprovação" : "Em análise técnica"),
        created: d.created_at,
        data_conclusao: d.data_conclusao || (d.status === "Concluído" || d.status === "Pronto para retirada" ? (d.created_at ? d.created_at.split('T')[0] : '') : ''),
        dias_garantia: d.dias_garantia !== undefined && d.dias_garantia !== null ? Number(d.dias_garantia) : 90
      }));
      localStorage.setItem("wa_orders", JSON.stringify(orders));
      if (isUnlocked && (activeTab === 'orders' || activeTab === 'history' || activeTab === 'balance') && !window.location.search && !window.location.hash) renderDashboard();
    }
  });

  supabaseClient.from("visitas").select("*").order("id", { ascending: false }).then(({ data: vData, error: vErr }) => {
    if (!vErr && vData && vData.length > 0) {
      visits = vData.map(v => ({
        id: "VIS-" + v.id,
        dbId: v.id,
        cliente_nome: v.cliente_nome,
        telefone: v.telefone,
        endereco: v.endereco,
        data_visita: v.data_visita,
        horario_visita: v.horario_visita,
        aparelho_motivo: v.aparelho_motivo,
        observacoes: v.observacoes,
        motivo_recusa: v.motivo_recusa || "",
        status: v.status || "Agendada"
      }));
      localStorage.setItem("wa_visits", JSON.stringify(visits));
      if (isUnlocked && activeTab === 'visits' && !window.location.search && !window.location.hash) renderDashboard();
    }
  });
}

function unlock(e) {
  e.preventDefault();
  const input = document.getElementById("pinInput").value.trim();
  if (input === adminPin) {
    isUnlocked = true;
    sessionStorage.setItem("wa_unlocked", "true");
    renderDashboard();
  } else {
    alert("Senha incorreta! A senha padrão é 1234.");
  }
}

function lock() {
  isUnlocked = false;
  sessionStorage.removeItem("wa_unlocked");
  renderLockScreen();
}

function setTab(tab) {
  activeTab = tab;
  localStorage.setItem("wa_active_tab", tab);
  renderDashboard();
}

// Upload e compressão da Foto 1 (Entrada)
async function handleEntryImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const compressedBase64 = await compressAndResizeImage(file);
    document.getElementById("osPhotoEntry").value = compressedBase64;
    const preview = document.getElementById("imagePreviewEntry");
    preview.src = compressedBase64;
    document.getElementById("previewEntryContainer").style.display = "block";
  } catch(err) {
    console.error("Erro ao comprimir imagem:", err);
  }
}

// Upload e compressão da Foto 2 (Defeito/Bancada no Modal de Edição)
async function handleDefectImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const compressedBase64 = await compressAndResizeImage(file);
    document.getElementById("editOsPhotoDefect").value = compressedBase64;
    const preview = document.getElementById("editImagePreviewDefect");
    preview.src = compressedBase64;
    document.getElementById("editPreviewDefectContainer").style.display = "block";
  } catch(err) {
    console.error("Erro ao comprimir imagem de defeito:", err);
  }
}

function openPixQrModal(id) {
  const o = orders.find(item => String(item.id) === String(id));
  if (!o) return;

  if (!companyPixKey) {
    alert("Por favor, configure sua Chave PIX primeiro no botão '⚙️ Config. PIX' no topo da tela.");
    openKeyModal();
    return;
  }

  const preco = Number(o.price || 0);
  const entrada = Number(o.entryFee || 0);
  const restante = Math.max(0, preco - entrada);
  const valorCobrado = restante > 0 ? restante : preco;

  if (valorCobrado <= 0) {
    alert("O orçamento desta ordem ainda está em análise (R$ 0,00). Defina o valor ao editar a ordem para gerar o QR Code.");
    return;
  }

  const txid = "OS" + String(o.id).replace(/\D/g, "").slice(0, 20);
  const pixPayload = gerarPixPayload(companyPixKey, valorCobrado, "WA RESOLVE", "MOSSORO", txid);

  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div class="modal-box" style="text-align:center;">
      <h3 style="color:var(--navy); margin-bottom:6px;">💳 Pagamento PIX - ${o.id}</h3>
      <p style="font-size:13px; color:var(--muted); margin-bottom:12px;">Valor com preenchimento automático: <strong style="color:var(--green); font-size:16px;">${formatBRL(valorCobrado)}</strong></p>
      
      <div id="pixQrContainer" style="display:flex; justify-content:center; margin:16px auto; background:#fff; padding:10px; border-radius:10px; border:1px solid #cbd5e1; width:220px; height:220px;"></div>

      <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:8px; font-family:monospace; font-size:11px; word-break:break-all; max-height:70px; overflow-y:auto; margin-bottom:12px; color:#334155;">
        ${pixPayload}
      </div>

      <div style="display:flex; gap:8px; justify-content:center;">
        <button class="primary" style="background:#16a34a;" onclick="copyPixDirect('${pixPayload}')">📋 Copiar Código Pix</button>
        <button class="secondary" onclick="this.closest('.modal').remove()">Fechar</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  setTimeout(() => {
    new QRCode(document.getElementById("pixQrContainer"), {
      text: pixPayload,
      width: 200,
      height: 200,
      colorDark: "#102b50",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  }, 60);
}

function renderHistory() {
  const completedOrders = orders.filter(o => 
    o.status === "Concluído" || o.status === "Pronto para retirada" || o.status === "Entregue"
  );

  let totalFaturamento = 0;
  let totalCustoPecas = 0;
  let ativasCount = 0;
  let expiradasCount = 0;

  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);

  const filtered = completedOrders.filter(o => {
    if (!historySearchQuery) return true;
    const q = historySearchQuery.toLowerCase();
    return (o.name && o.name.toLowerCase().includes(q)) ||
           (o.appliance && o.appliance.toLowerCase().includes(q)) ||
           (o.id && o.id.toLowerCase().includes(q)) ||
           (o.sealNumber && o.sealNumber.toLowerCase().includes(q)) ||
           (o.brand && o.brand.toLowerCase().includes(q));
  });

  let rowsHtml = "";
  if (filtered.length === 0) {
    rowsHtml = `<tr><td colspan="7" style="text-align:center; padding:28px; color:var(--muted);">Nenhum serviço concluído encontrado no histórico.</td></tr>`;
  } else {
    filtered.forEach(o => {
      const preco = Number(o.price) || 0;
      const custo = (o.partsUsed && Array.isArray(o.partsUsed)) 
        ? o.partsUsed.reduce((s, p) => s + (Number(p.preco) || 0) * (Number(p.qtd) || 1), 0)
        : 0;
      const lucro = preco - custo;

      totalFaturamento += preco;
      totalCustoPecas += custo;

      const dataBaseStr = o.data_conclusao || (o.created ? o.created.split('T')[0] : '');
      const diasGarantia = Number(o.dias_garantia !== undefined ? o.dias_garantia : 90);

      let dataFimFormatada = "-";
      let statusGarantiaBadge = '<span class="tag" style="background:#f1f5f9; color:#64748b;">Sem data</span>';

      if (dataBaseStr && diasGarantia > 0) {
        const [ano, mes, dia] = dataBaseStr.split('-');
        const dtFim = new Date(ano, mes - 1, dia);
        dtFim.setDate(dtFim.getDate() + diasGarantia);

        dataFimFormatada = formatarDataBR(dtFim.toISOString().split('T')[0]);

        if (hoje <= dtFim) {
          const diffMs = dtFim - hoje;
          const diffDias = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
          statusGarantiaBadge = `<span class="tag" style="background:#d1fae5; color:#065f46;">Ativa (${diffDias}d restam)</span>`;
          ativasCount++;
        } else {
          statusGarantiaBadge = `<span class="tag" style="background:#f1f5f9; color:#64748b;">Expirada</span>`;
          expiradasCount++;
        }
      }

      rowsHtml += `
        <tr>
          <td>
            <strong>${o.id}</strong>
            ${o.sealNumber ? `<br><small style="color:var(--blue);">Lacre: ${o.sealNumber}</small>` : ''}
          </td>
          <td>
            <strong>${o.name}</strong><br>
            <small style="color:var(--muted);">${o.appliance} ${o.brand ? '· ' + o.brand : ''}</small>
          </td>
          <td>${formatarDataBR(dataBaseStr)}</td>
          <td>
            <div style="font-size:12px;">
              <span>Início: <strong>${formatarDataBR(dataBaseStr)}</strong></span><br>
              <span>Fim: <strong>${dataFimFormatada}</strong> (${diasGarantia} dias)</span>
            </div>
          </td>
          <td>${statusGarantiaBadge}</td>
          <td style="text-align:right; font-weight:700; color:var(--navy);">${formatBRL(preco)}</td>
          <td style="text-align:right; font-weight:700; color:var(--green);">${formatBRL(lucro)}</td>
        </tr>
      `;
    });
  }

  const lucroLiquidoGeral = totalFaturamento - totalCustoPecas;

  return `
    <div class="stats">
      <div class="stat">
        <span>Serviços Realizados</span>
        <strong>${completedOrders.length}</strong>
        <small style="color:var(--muted);">${ativasCount} com garantia ativa</small>
      </div>
      <div class="stat" style="border-left-color: var(--green);">
        <span>Faturamento Geral</span>
        <strong style="color:var(--green);">${formatBRL(totalFaturamento)}</strong>
        <small style="color:var(--muted);">Total faturado no histórico</small>
      </div>
      <div class="stat" style="border-left-color: var(--red);">
        <span>Custo Geral Peças</span>
        <strong style="color:var(--red);">${formatBRL(totalCustoPecas)}</strong>
        <small style="color:var(--muted);">Peças consumidas do estoque</small>
      </div>
      <div class="stat" style="border-left-color: #10b981;">
        <span>Lucro Líquido Real</span>
        <strong style="color:#10b981;">${formatBRL(lucroLiquidoGeral)}</strong>
        <small style="color:var(--muted);">Margem líquida do técnico</small>
      </div>
    </div>

    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
        <h2 style="margin-bottom:0;"><span style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;background:#1672d3;color:#fff;font-size:20px;margin-right:8px;">🛡️</span> Histórico de Serviços & Garantias</h2>
        <input class="visit-search" type="text" placeholder="⌕ Buscar cliente, OS, aparelho ou lacre..." value="${historySearchQuery.replace(/"/g, '&quot;')}" oninput="filterHistory(this.value)">
      </div>

      <div style="overflow-x:auto;">
        <table class="table-custom">
          <thead>
            <tr>
              <th>OS / Lacre</th>
              <th>Cliente / Aparelho</th>
              <th>Data Conclusão</th>
              <th>Vigência da Garantia</th>
              <th>Status Garantia</th>
              <th style="text-align:right;">Valor do Serviço</th>
              <th style="text-align:right;">Lucro Líquido</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function savePart(e) {
  e.preventDefault();
  const nome = document.getElementById("pNome").value.trim();
  const preco = parseFloat(document.getElementById("pPreco").value) || 0;
  const estoque = parseInt(document.getElementById("pEstoque").value) || 0;

  parts.push({ id: Date.now(), nome, preco, estoque });
  localStorage.setItem("wa_parts", JSON.stringify(parts));
  alert("✅ Peça cadastrada com sucesso!");
  renderDashboard();
}

function editPart(id) {
  const p = parts.find(item => item.id === id);
  if (!p) return;
  const novoNome = prompt("Nome da Peça:", p.nome);
  if (novoNome === null) return;
  const novoPreco = prompt("Preço Unitário (R$):", p.preco);
  if (novoPreco === null) return;
  const novoEstoque = prompt("Quantidade em Estoque:", p.estoque);
  if (novoEstoque === null) return;

  p.nome = novoNome.trim();
  p.preco = parseFloat(novoPreco) || 0;
  p.estoque = parseInt(novoEstoque) || 0;
  localStorage.setItem("wa_parts", JSON.stringify(parts));
  alert("✅ Peça atualizada com sucesso!");
  renderDashboard();
}

function deletePart(id) {
  if (!confirm("⚠️ Deseja realmente excluir esta peça?")) return;
  parts = parts.filter(item => item.id !== id);
  localStorage.setItem("wa_parts", JSON.stringify(parts));
  alert("Peça excluída com sucesso!");
  renderDashboard();
}

function renderBalance() {
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();

  const filteredOrders = orders.filter(o => {
    if (balanceFilterPeriod === "all") return true;
    const dStr = o.data_conclusao || o.created;
    if (!dStr) return false;
    const d = new Date(dStr);
    if (balanceFilterPeriod === "current_month") {
      return d.getFullYear() === curYear && d.getMonth() === curMonth;
    } else if (balanceFilterPeriod === "last_month") {
      const prevMonthDate = new Date(curYear, curMonth - 1, 1);
      return d.getFullYear() === prevMonthDate.getFullYear() && d.getMonth() === prevMonthDate.getMonth();
    }
    return true;
  });

  const totalOrders = filteredOrders.length;
  const completedOrders = filteredOrders.filter(o => o.status === "Concluído" || o.status === "Pronto para retirada" || o.status === "Entregue");
  const totalFaturamento = filteredOrders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
  const totalSinais = filteredOrders.reduce((sum, o) => sum + (Number(o.entryFee) || 0), 0);
  const totalCustoPecas = filteredOrders.reduce((sum, o) => {
    if (o.partsUsed && Array.isArray(o.partsUsed)) {
      return sum + o.partsUsed.reduce((s, p) => s + ((Number(p.preco) || 0) * (Number(p.qtd) || 1)), 0);
    }
    return sum;
  }, 0);
  const lucroLiquido = totalFaturamento - totalCustoPecas;

  let statusRows = '';
  const statuses = ["Em análise técnica", "Aguardando aprovação", "Em conserto", "Pronto para retirada", "Concluído", "Não aprovado"];
  statuses.forEach(st => {
    const count = filteredOrders.filter(o => o.status === st).length;
    const pct = totalOrders > 0 ? ((count / totalOrders) * 100).toFixed(1) : "0.0";
    statusRows += `<tr><td>${st}</td><td>${count}</td><td>${pct}%</td></tr>`;
  });

  return `
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <h2 style="color:var(--navy); font-size:20px;">📊 Balanço Financeiro da WA Resolve</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <label style="font-size:13px; font-weight:700; color:#42536b;">Filtrar Período:</label>
        <select onchange="changeBalancePeriod(this.value)" style="border:1px solid #d7e0eb; border-radius:8px; padding:6px 12px; font-size:14px; background:#fff;">
          <option value="all" ${balanceFilterPeriod==='all'?'selected':''}>Todo o Período</option>
          <option value="current_month" ${balanceFilterPeriod==='current_month'?'selected':''}>Mês Atual</option>
          <option value="last_month" ${balanceFilterPeriod==='last_month'?'selected':''}>Mês Anterior</option>
        </select>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>Ordens no Período</span><strong>${totalOrders}</strong><small style="color:var(--muted);">${completedOrders.length} concluídas</small></div>
      <div class="stat" style="border-left-color: var(--green);"><span>Faturamento Bruto</span><strong style="color:var(--green);">${formatBRL(totalFaturamento)}</strong><small style="color:var(--muted);">Sinais recebidos: ${formatBRL(totalSinais)}</small></div>
      <div class="stat" style="border-left-color: var(--red);"><span>Custo Peças (Estoque)</span><strong style="color:var(--red);">${formatBRL(totalCustoPecas)}</strong><small style="color:var(--muted);">Gasto em componentes</small></div>
      <div class="stat" style="border-left-color: #10b981;"><span>Lucro Líquido Real</span><strong style="color:#10b981;">${formatBRL(lucroLiquido)}</strong><small style="color:var(--muted);">Margem após peças</small></div>
    </div>

    <div class="panel">
      <div class="two" style="margin-top:10px;">
        <div>
          <h3 style="font-size:15px; color:var(--navy); margin-bottom:10px;">📋 Distribuição de Serviços</h3>
          <table class="table-custom">
            <thead>
              <tr><th>Status</th><th>Qtd de OS</th><th>% do Total</th></tr>
            </thead>
            <tbody>
              ${statusRows}
            </tbody>
          </table>
        </div>
        
        <div>
          <h3 style="font-size:15px; color:var(--navy); margin-bottom:10px;">💰 Demonstrativo Financeiro</h3>
          <table class="table-custom">
            <thead>
              <tr><th>Componente</th><th>Valor</th><th>% Faturamento</th></tr>
            </thead>
            <tbody>
              <tr><td>Faturamento Total Bruto</td><td>${formatBRL(totalFaturamento)}</td><td>100,0%</td></tr>
              <tr><td>Custo Total de Peças</td><td>${formatBRL(totalCustoPecas)}</td><td>${totalFaturamento > 0 ? ((totalCustoPecas/totalFaturamento)*100).toFixed(1) : '0.0'}%</td></tr>
              <tr><td><strong>Lucro Líquido do Técnico</strong></td><td><strong style="color:var(--green);">${formatBRL(lucroLiquido)}</strong></td><td>${totalFaturamento > 0 ? ((lucroLiquido/totalFaturamento)*100).toFixed(1) : '0.0'}%</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

}

function changeVisitStatus(id) {
  const v = visits.find(item => String(item.id) === String(id));
  if (!v) return;
  const novo = prompt("Novo status da visita:\n1 - Agendada\n2 - Confirmada\n3 - Realizada\n4 - Reagendar / Não autorizado\n5 - Cancelada", v.status);
  if (!novo) return;
  if (novo === "1") v.status = "Agendada";
  else if (novo === "2") v.status = "Confirmada";
  else if (novo === "3") v.status = "Realizada";
  else if (novo === "4") v.status = "Reagendar / Não autorizado";
  else if (novo === "5") v.status = "Cancelada";
  else v.status = novo;

  localStorage.setItem("wa_visits", JSON.stringify(visits));
  if (supabaseClient && v.dbId) {
    supabaseClient.from("visitas").update({ status: v.status }).eq("id", v.dbId);
  }
  renderDashboard();
}

async function deleteVisit(id) {
  if (!confirm(`⚠️ Deseja realmente excluir esta visita agendada?`)) return;
  const v = visits.find(item => String(item.id) === String(id));
  visits = visits.filter(item => String(item.id) !== String(id));
  localStorage.setItem("wa_visits", JSON.stringify(visits));
  if (supabaseClient && v && v.dbId) {
    try {
      await supabaseClient.from("visitas").delete().eq("id", v.dbId);
    } catch(err) {
      console.warn("Erro ao excluir visita na nuvem:", err);
    }
  }
  renderDashboard();
}

function getPublicSiteBaseUrl() {
  const configured = (localStorage.getItem("wa_public_url") || "").trim();
  const candidate = configured || (window.location.origin + window.location.pathname);

  try {
    const parsed = new URL(candidate, window.location.href);
    if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
      throw new Error("Endereço público inválido.");
    }
    parsed.search = "";
    parsed.hash = "";
    return parsed.href.replace(/\/$/, "") + "/";
  } catch (error) {
    console.error("URL pública inválida:", error);
    return window.location.origin + window.location.pathname.replace(/[^/]*$/, "");
  }
}

function getOrderDatabaseId(orderId) {
  const order = orders.find(item => String(item.id) === String(orderId));
  if (!order || order.localOnly || !order.dbId) return null;
  const rawId = String(order.dbId);
  return /^\d+$/.test(rawId) && Number(rawId) > 0 ? rawId : null;
}

        <p style="margin-bottom:8px;"><strong>Defeito Relatado:</strong> ${o.problem || 'Não especificado'}</p>
        <p style="margin-bottom:8px;"><strong>Diagnóstico Técnico:</strong> ${o.diagnosis || 'Em avaliação de bancada'}</p>
        <p style="margin-bottom:8px; font-size:18px;"><strong>Valor Total do Orçamento:</strong> <span style="color:var(--green); font-weight:800;">${preco > 0 ? formatBRL(preco) : 'A definir após análise técnica'}</span></p>
        ${o.entryFee > 0 ? `<p style="margin-bottom:8px; font-size:14px; color:#166534;"><strong>Sinal Pago:</strong> ${formatBRL(o.entryFee)} | <strong>Saldo Restante na Entrega:</strong> ${preco > 0 ? formatBRL(preco - o.entryFee) : 'A calcular'}</p>` : ''}
        ${o.refusalFee > 0 ? `<p style="font-size:12px; color:var(--red);">* Taxa de análise/deslocamento caso o orçamento não seja aprovado: R$ ${Number(o.refusalFee).toFixed(2)}</p>` : ''}
      </div>

      ${actionsHtml}
    </div>
  `;

  if (pixPayloadClient) {
    setTimeout(() => {
      const qrEl = document.getElementById("clientPixQrContainer");
      if (qrEl) {
        new QRCode(qrEl, {
          text: pixPayloadClient,
          width: 170,
          height: 170,
          colorDark: "#102b50",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }, 60);
  }
}

function copyPixDirect(key) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(key).then(() => {
      alert("✅ Código PIX copiado com sucesso! Abra o app do seu banco e escolha 'PIX Copia e Cola'.");
    }).catch(() => {
      prompt("Copie o código PIX abaixo:", key);
    });
  } else {
    prompt("Copie o código PIX abaixo:", key);
  }
}

async function clientActionOrder(id, newStatus, dbId) {
  const o = orders.find(item => item.id === id);
  if (o) {
    o.status = newStatus;
    localStorage.setItem("wa_orders", JSON.stringify(orders));
  }
  
  const realDbId = dbId || (o ? o.dbId : id.replace(/\D/g, ""));
  if (supabaseClient && realDbId && realDbId > 0) {
    try {
      await supabaseClient.from("ordens_servico").update({ status: newStatus }).eq("id", realDbId);
    } catch(err) {
      console.warn("Erro ao atualizar status na nuvem:", err);
    }
  }
  
  alert("✅ Status do orçamento atualizado!");
  renderClientView(realDbId);
}

function renderClientVisitView(id) {
  document.getElementById("app").innerHTML = '<div style="text-align:center; padding:60px;"><h2>Carregando visita...</h2></div>';

  let v = visits.find(item => String(item.id).toUpperCase() === String(id).toUpperCase() || String(item.dbId) === String(id));

  if (!v && supabaseClient) {
    supabaseClient.from("visitas").select("*").then(({data}) => {
      if (data && data.length > 0) {
        let found = data.find(item => String(item.id) === String(id).replace(/\D/g, "") || "VIS-" + item.id === String(id));
        if (!found) found = data[0];
        if (found) {
          v = {
            id: "VIS-" + found.id,
            dbId: found.id,
            cliente_nome: found.cliente_nome,
            telefone: found.telefone,
            endereco: found.endereco,
            data_visita: found.data_visita,
            horario_visita: found.horario_visita,
            aparelho_motivo: found.aparelho_motivo,
            observacoes: found.observacoes,
            motivo_recusa: found.motivo_recusa || "",
            status: found.status
          };
          displayClientVisitPage(v);
          return;
        }
      }
      document.getElementById("app").innerHTML = '<div style="max-width:500px; margin:60px auto; background:#fff; padding:30px; border-radius:14px; text-align:center;"><h2 style="color:var(--navy);">Visita não encontrada</h2></div>';
    });
    return;
  }

  if (v) {
    displayClientVisitPage(v);
  }
}

function displayClientVisitPage(v) {
  const dataFormatada = formatarDataBR(v.data_visita);
  const companyPhoneClean = (companyWhatsApp || "").replace(/\D/g, "");
  const logoHeader = companyLogoUrl ? `
    <div style="text-align:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--line);">
      <img src="${companyLogoUrl}" alt="Logo WA Resolve" style="max-height:85px; width:auto; max-width:240px; object-fit:contain;">
    </div>` : '';

  const isConfirmed = String(v.status).toLowerCase().includes("confirmada");
  const visitActionsHtml = isConfirmed ? `
    <div style="margin-top:20px; background:#d1fae5; border:1px solid #10b981; border-radius:10px; padding:16px; text-align:center;">
      <h3 style="color:#065f46; font-size:16px; margin-bottom:4px;">✅ Visita / Coleta Confirmada!</h3>
      <p style="color:#047857; font-size:14px;">Agradecemos a confirmação. Nossa equipe comparecerá no horário agendado.</p>
    </div>
  ` : `
    <div style="display:grid; gap:10px;">
      <button class="primary" style="width:100%; padding:14px; background:var(--green); font-size:16px;" onclick="confirmarColetaCliente('${v.id}', ${v.dbId || 0})">✅ SIM, pode coletar no horário previsto</button>
      <button class="danger-btn" style="width:100%; padding:14px; font-size:15px;" onclick="recusarColetaCliente('${v.id}', ${v.dbId || 0})">❌ NÃO, não poderei receber (informar motivo)</button>
    </div>
  `;

  document.getElementById("app").innerHTML = `
    <header class="top">
      <div class="brand">
        <div class="brand-badge">WA RESOLVE</div>
        <span>Confirmação de Coleta / Visita Técnica</span>
      </div>
    </header>
    <div style="max-width:600px; margin:20px auto; background:#fff; border-radius:14px; padding:22px; border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,0.05);">
      ${logoHeader}
      <div style="text-align:center; margin-bottom:18px;">
        <span class="tag ${v.status}" style="font-size:13px; padding:6px 14px;">Status: ${v.status}</span>
        <h2 style="color:var(--navy); margin-top:10px;">Coleta de Equipamento</h2>
        <p style="color:var(--muted);">WA Resolve Assistência Técnica</p>
      </div>

      <div style="background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px;">
        <p style="margin-bottom:8px;"><strong>Cliente:</strong> ${v.cliente_nome}</p>
        <p style="margin-bottom:8px;"><strong>Equipamento a ser coletado:</strong> <span style="color:var(--blue); font-weight:700;">${v.aparelho_motivo}</span></p>
        <p style="margin-bottom:8px;"><strong>Data Prevista:</strong> 📅 ${dataFormatada}</p>
        <p style="margin-bottom:8px;"><strong>Horário Previsto:</strong> ⏰ ${v.horario_visita}</p>
        <p style="margin-bottom:0;"><strong>Endereço:</strong> 📍 ${v.endereco}</p>
      </div>

      <div style="text-align:center; margin-bottom:16px;">
        <h3 style="font-size:16px; color:var(--navy); margin-bottom:8px;">Podemos comparecer para coletar o seu equipamento?</h3>
      </div>

      ${visitActionsHtml}

      ${companyPhoneClean ? `
        <div style="margin-top:20px; text-align:center;">
          <button class="whatsapp-btn" style="width:100%; padding:10px;" onclick="window.open('https://wa.me/55${companyPhoneClean}?text=Olá! Estou vendo o agendamento da visita ${v.id}.', '_blank')">💬 Falar com a Assistência no WhatsApp</button>
        </div>
      ` : ''}
    </div>
  `;
}

function confirmarColetaCliente(id, dbId) {
  const v = visits.find(item => String(item.id) === String(id));
  if (v) {
    v.status = "Confirmada";
    localStorage.setItem("wa_visits", JSON.stringify(visits));
  }
  const realDbId = dbId || (v ? v.dbId : id.replace(/\D/g, ""));
  if (supabaseClient && realDbId && realDbId > 0) {
    supabaseClient.from("visitas").update({ status: "Confirmada" }).eq("id", realDbId);
  }
  alert("✅ Muito obrigado! Visita confirmada.");
  renderClientVisitView(id);
}

function recusarColetaCliente(id, dbId) {
  const motivo = prompt("Por favor, informe o motivo ou sugira outra data/horário:");
  if (motivo !== null) {
    const v = visits.find(item => String(item.id) === String(id));
    if (v) {
      v.status = "Reagendar / Não autorizado";
      v.motivo_recusa = motivo || "Cliente não informou o motivo";
      localStorage.setItem("wa_visits", JSON.stringify(visits));
    }
    const realDbId = dbId || (v ? v.dbId : id.replace(/\D/g, ""));
    if (supabaseClient && realDbId && realDbId > 0) {
      supabaseClient.from("visitas").update({ status: "Reagendar / Não autorizado", observacoes: "Motivo: " + (motivo || "Não informado") }).eq("id", realDbId);
    }
    alert("Agradecemos o aviso! Entraremos em contato.");
    renderClientVisitView(id);
  }
}
</script>
