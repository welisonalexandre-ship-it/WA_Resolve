<script>
// Acesso resiliente ao armazenamento: evita que dados locais inválidos impeçam o site de abrir.
function safeGet(storage, key, fallback = "") {
  try { const value = storage.getItem(key); return value === null ? fallback : value; }
  catch (error) { console.warn("Armazenamento indisponível:", key, error); return fallback; }
}
function safeSet(storage, key, value) {
  try { storage.setItem(key, value); return true; }
  catch (error) { console.warn("Não foi possível salvar:", key, error); return false; }
}
function safeJSON(storage, key, fallback = []) {
  try { const value = safeGet(storage, key, ""); return value ? JSON.parse(value) : fallback; }
  catch (error) { console.warn("Dados locais inválidos; usando lista vazia:", key, error); return fallback; }
}
const SUPABASE_URL = "https://xuletvulgzdnuukynlhs.supabase.co";
const FIXED_SUPABASE_KEY = "sb_publishable_j7pad31FTUWcxR7NlpN4ng_HssGl2AC";

let supabaseClient = null;

    supabaseClient = window.supabase.createClient(SUPABASE_URL, FIXED_SUPABASE_KEY);

function formatarDataBR(dataIso) {
  if (!dataIso) return "";
  const partes = String(dataIso).split("T")[0].split("-");
  if (partes.length === 3) {
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  return dataIso;
}

window.addEventListener("DOMContentLoaded", () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const clienteId = params.get("cliente");
    const visitaId = params.get("visita");

    if (visitaId) {
      renderClientVisitView(visitaId);
    } else if (clienteId) {
      renderClientView(clienteId);
    } else if (!isUnlocked) {
      renderLockScreen();
    } else {
      renderDashboard();
    }

    if (supabaseClient) {
      syncFromSupabase();
    }
  } catch(err) {
    console.error("Erro no DOMContentLoaded:", err);
    document.getElementById("app").innerHTML = '<div style="padding:40px; text-align:center;"><h2>Painel WA Resolve</h2><p><a href="?" style="color:var(--blue);">Clique aqui para recarregar o sistema</a></p></div>';
  }
});

function syncFromSupabase() {
  if (!supabaseClient) return;
  supabaseClient.from("clientes").select("*").order("id", { ascending: false }).then(({ data: cData, error: cErr }) => {
    if (!cErr && cData && cData.length > 0) {
      clients = cData.map(dbClient => {
        const localMatch = clients.find(lc => String(lc.id) === String(dbClient.id) || (lc.nome && dbClient.nome && lc.nome.toLowerCase() === dbClient.nome.toLowerCase()));
        return {
          ...dbClient,
          endereco: dbClient.endereco || (localMatch && localMatch.endereco ? localMatch.endereco : "")
        };
      });
      clients = clients.concat(clients.filter(lc => !cData.some(dc => String(dc.id) === String(lc.id))));
      safeSet(localStorage, "wa_clients", JSON.stringify(clients));
    }
  });

  supabaseClient.from("ordens_servico").select("*, clientes(*)").order("id", { ascending: false }).then(({ data: oData, error: oErr }) => {
    if (!oErr && oData && oData.length > 0) {
      orders = oData.map(d => ({
        id: "WR-" + d.id,
        dbId: d.id,
        name: d.clientes ? d.clientes.nome : "Cliente",
        phone: d.clientes ? d.clientes.telefone : "",
        appliance: d.titulo_servico || "Aparelho",
        brand: d.marca || "",
        problem: d.defeito || d.descricao || "",
        diagnosis: d.diagnostico || "",
        price: Number(d.orcamento) || 0,
        refusalFee: Number(d.taxa_recusa) || 0,
        photoUrl: d.foto_url || "",
        status: d.status || "Aguardando aprovação",
        created: d.created_at
      }));
      safeSet(localStorage, "wa_orders", JSON.stringify(orders));
    }
  });

  supabaseClient.from("visitas").select("*").order("id", { ascending: false }).then(({ data: vData, error: vErr }) => {
    if (!vErr && vData && vData.length > 0) {
      visits = vData.map(v => ({
        id: "VIS-" + v.id,
        dbId: v.id,
        cliente_nome: v.cliente_nome,
        telefone: v.telefone,
        endereco: v.endereco,
        data_visita: v.data_visita,
        horario_visita: v.horario_visita,
        aparelho_motivo: v.aparelho_motivo,
        observacoes: v.observacoes,
        motivo_recusa: v.motivo_recusa || "",
        status: v.status || "Agendada"
      }));
      safeSet(localStorage, "wa_visits", JSON.stringify(visits));
      if (activeTab === 'visits') renderDashboard();
    }
  });
}

function renderOrders() {
  const awaiting = orders.filter(o => o.status === "Aguardando aprovação").length;

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64String = e.target.result;
    document.getElementById("osPhoto").value = base64String;
    document.getElementById("osPhotoUrlDirect").value = "[Imagem anexada do computador]";
    const preview = document.getElementById("imagePreview");
    preview.src = base64String;
    document.getElementById("previewContainer").style.display = "block";
  };
  reader.readAsDataURL(file);
}

function filterVisits(q) {
  visitSearchQuery = q;
  safeSet(localStorage, "wa_visit_search", q);
  renderDashboard();
}

function handleVisitClientSelect(valorDigitado) {
  if (!valorDigitado) return;
  const termo = valorDigitado.trim().toLowerCase();
  const c = clients.find(item => item.nome && item.nome.trim().toLowerCase() === termo);
  if (c) {
    if (c.telefone) document.getElementById("vTelefone").value = c.telefone;
    if (c.endereco) document.getElementById("vEndereco").value = c.endereco;
  }
}

function autoFillOrderClient(valorDigitado) {
  if (!valorDigitado) return;
  const termo = valorDigitado.trim().toLowerCase();
  const c = clients.find(item => item.nome && item.nome.trim().toLowerCase() === termo);
  if (c && c.telefone) {
    document.getElementById("osPhone").value = c.telefone;
  }
}

function sendOrderToClient(clientPhone, orderId, clientName, appliance, price, photoUrl, details) {
  const cleanPhone = (clientPhone || "").replace(/\D/g, "");
  if (!cleanPhone) {
    alert("Esta ordem não possui o WhatsApp do cliente cadastrado.");
    return;
  }
  
  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(appliance);
  const detalhesTxt = decodeURIComponent(details || "");

  const publicBaseUrl = safeGet(localStorage, "wa_public_url") || "";
  const activeBase = publicBaseUrl && publicBaseUrl.startsWith("http") ? publicBaseUrl : window.location.origin + window.location.pathname;
  const logoParam = clientLogoUrl ? "&logo=" + encodeURIComponent(clientLogoUrl) : "";
  const urlOs = activeBase.replace(/\/$/, "") + "?cliente=" + encodeURIComponent(orderId) + logoParam;

  const texto = 
`Olá, *${nomeCliente}*! Segue o link de visualização da sua Ordem (${orderId}) referente ao conserto do seu(sua) *${nomeAparelho}* na WA Resolve:

💰 *Valor:* R$ ${Number(price).toFixed(2)}
${detalhesTxt ? `🛠️ *Serviço:* ${detalhesTxt}
` : ""}
👉 *Clique no link abaixo para ver a foto do equipamento, detalhes e aprovar online:*
${urlOs}`;

  const fullPhone = cleanPhone.startsWith("55") ? cleanPhone : "55" + cleanPhone;
  const url = `https://wa.me/${fullPhone}?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
}

function sendVisitConfirmationToWhatsApp(phone, clientName, dataIso, horario, aparelho, visitId) {
  const cleanPhone = (phone || "").replace(/\D/g, "");
  if (!cleanPhone) {
    alert("Esta visita não possui o WhatsApp do cliente cadastrado.");
    return;
  }
  
  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(aparelho || "Equipamento");
  const horarioTxt = decodeURIComponent(horario);
  const dataFormatada = formatarDataBR(dataIso);

  const publicBaseUrl = safeGet(localStorage, "wa_public_url") || "";
  const activeBase = publicBaseUrl && publicBaseUrl.startsWith("http") ? publicBaseUrl : window.location.origin + window.location.pathname;
  const logoParam = clientLogoUrl ? "&logo=" + encodeURIComponent(clientLogoUrl) : "";
  const urlVisita = activeBase.replace(/\/$/, "") + "?visita=" + encodeURIComponent(visitId) + logoParam;

  const texto = 
`Olá, *${nomeCliente}*! Confirmando a visita técnica da WA Resolve no dia ${dataFormatada} no horário ${horarioTxt}.

👉 *Clique para responder SIM ou NÃO online:*
${urlVisita}`;

  const fullPhone = cleanPhone.startsWith("55") ? cleanPhone : "55" + cleanPhone;
  const url = `https://wa.me/${fullPhone}?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
}

function renderClientView(id) {
  document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Carregando orçamento...</h2></div>`;

  let o = orders.find(item => String(item.id).toUpperCase() === String(id).toUpperCase() || String(item.dbId) === String(id));

  if (!o && supabaseClient) {
    supabaseClient.from("ordens_servico").select("*, clientes(*)").then(({data}) => {
      if (data) {
        const found = data.find(d => String(d.id) === String(id).replace(/\D/g, "") || "WR-" + d.id === String(id));
        if (found) {
          o = {
            id: "WR-" + found.id,
            dbId: found.id,
            name: found.clientes ? found.clientes.nome : "Cliente",
            phone: found.clientes ? found.clientes.telefone : "",
            appliance: found.titulo_servico || "Aparelho",
            brand: found.marca || "",
            problem: found.defeito || found.descricao || "",
            diagnosis: found.diagnostico || "",
            price: Number(found.orcamento) || 0,
            refusalFee: Number(found.taxa_recusa) || 0,
            photoUrl: found.foto_url || "",
            status: found.status || "Aguardando aprovação"
          };
          displayClientOrderPage(o);
          return;
        }
      }
      document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Ordem não encontrada</h2></div>`;
    });
    return;
  }

  if (o) {
    displayClientOrderPage(o);
  } else {
    document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Ordem não encontrada</h2></div>`;
  }
}

function renderClientVisitView(id) {
  document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Carregando visita...</h2></div>`;

  let v = visits.find(item => String(item.id).toUpperCase() === String(id).toUpperCase() || String(item.dbId) === String(id));

  if (!v && supabaseClient) {
    supabaseClient.from("visitas").select("*").then(({data}) => {
      if (data && data.length > 0) {
        let found = data.find(item => String(item.id) === String(id).replace(/\D/g, "") || "VIS-" + item.id === String(id));
        if (!found) found = data[0];
        if (found) {
          v = {
            id: "VIS-" + found.id,
            dbId: found.id,
            cliente_nome: found.cliente_nome,
            telefone: found.telefone,
            endereco: found.endereco,
            data_visita: found.data_visita,
            horario_visita: found.horario_visita,
            aparelho_motivo: found.aparelho_motivo,
            observacoes: found.observacoes,
            motivo_recusa: found.motivo_recusa || "",
            status: found.status
          };
          displayClientVisitPage(v);
          return;
        }
      }
      document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Visita não encontrada</h2></div>`;
    });
    return;
  }

  if (v) {
    displayClientVisitPage(v);
  }
}

function confirmarColetaCliente(id, dbId) {
  const v = visits.find(item => item.id === id);
  if (v) {
    v.status = "Confirmada";
    safeSet(localStorage, "wa_visits", JSON.stringify(visits));
  }
  const realDbId = dbId || (v ? v.dbId : id.replace(/\D/g, ""));
  if (supabaseClient && realDbId) {
    supabaseClient.from("visitas").update({ status: "Confirmada" }).eq("id", realDbId);
  }
  alert("✅ Muito obrigado! Sua visita foi confirmada.");
  renderClientVisitView(id);
}

function recusarColetaCliente(id, dbId) {
  const motivo = prompt("Por favor, informe o motivo ou sugira uma nova data/horário:");
  if (motivo !== null) {
    const v = visits.find(item => item.id === id);
    if (v) {
      v.status = "Reagendar / Não autorizado";
      v.motivo_recusa = motivo || "Cliente não informou o motivo";
      safeSet(localStorage, "wa_visits", JSON.stringify(visits));
    }
    const realDbId = dbId || (v ? v.dbId : id.replace(/\D/g, ""));
    if (supabaseClient && realDbId) {
      supabaseClient.from("visitas").update({ status: "Reagendar / Não autorizado", observacoes: "Motivo: " + (motivo || "Não informado") }).eq("id", realDbId);
    }
    alert("Agradecemos o aviso! Entraremos em contato para combinar uma nova data.");
    renderClientVisitView(id);
  }
}

async function deleteVisit(id) {
  if (!confirm(`⚠️ Deseja realmente excluir este agendamento de visita?`)) return;

  const v = visits.find(item => String(item.id) === String(id));
  visits = visits.filter(item => String(item.id) !== String(id));
  safeSet(localStorage, "wa_visits", JSON.stringify(visits));

  if (supabaseClient && v && v.dbId) {
    try {
      await supabaseClient.from("visitas").delete().eq("id", v.dbId);
    } catch(err) {
      console.warn("Erro ao excluir visita no Supabase:", err);

  }

  alert("Visita excluída com sucesso!");
  renderDashboard();
}

async function saveOrder(e) {
  e.preventDefault();
  const name = document.getElementById("osName").value.trim();
  const phone = document.getElementById("osPhone").value.trim();
  const appliance = document.getElementById("osAppliance").value.trim();
  const brand = document.getElementById("osBrand").value.trim();
  const problem = document.getElementById("osProblem").value.trim();
  const diagnosis = document.getElementById("osDiagnosis").value.trim();
  const price = parseFloat(document.getElementById("osPrice").value) || 0;
  const refusalFee = parseFloat(document.getElementById("osRefusalFee").value) || 0;
  const photoUrl = document.getElementById("osPhoto").value.trim();
  const status = "Aguardando aprovação";

  let cId = null;

  if (supabaseClient) {
    try {
      let { data: existingClient } = await supabaseClient.from("clientes").select("id").eq("nome", name).limit(1);
      if (existingClient && existingClient.length > 0) {
        cId = existingClient[0].id;
      } else {
        let resClient = await supabaseClient.from("clientes").insert([{ nome: name, telefone: phone }]).select();
        if (resClient.data && resClient.data.length > 0) {
          cId = resClient.data[0].id;
        }
      }

      let osRes = await supabaseClient.from("ordens_servico").insert([{
        cliente_id: cId,
        titulo_servico: appliance,
        marca: brand,
        defeito: problem,
        diagnostico: diagnosis,
        orcamento: price,
        taxa_recusa: refusalFee,
        foto_url: photoUrl,
        status: status
      }]).select();

      if (osRes.data && osRes.data[0]) {
        const createdId = "WR-" + osRes.data[0].id;
        orders.push({
          id: createdId,
          dbId: osRes.data[0].id,
          name, phone, appliance, brand, problem, diagnosis, price, refusalFee, photoUrl, status,
          created: new Date().toISOString()
        });
        safeSet(localStorage, "wa_orders", JSON.stringify(orders));
        alert("Ordem " + createdId + " salva com sucesso na nuvem!");
        renderDashboard();
        return;
      }
    } catch(err) {
      console.warn("Erro ao salvar OS na nuvem:", err);
    }
  }

  const tempId = "WR-" + Math.floor(1000 + Math.random() * 9000);
  orders.push({ id: tempId, name, phone, appliance, brand, problem, diagnosis, price, refusalFee, photoUrl, status, created: new Date().toISOString() });
  safeSet(localStorage, "wa_orders", JSON.stringify(orders));
  alert("Ordem " + tempId + " cadastrada com sucesso!");
  renderDashboard();
}

async function saveClient(e) {
  e.preventDefault();
  const nome = document.getElementById("cNome").value.trim();
  const telefone = document.getElementById("cTelefone").value.trim();
  const endereco = document.getElementById("cEndereco") ? document.getElementById("cEndereco").value.trim() : "";

  clients.push(tempClient);
  safeSet(localStorage, "wa_clients", JSON.stringify(clients));

  if (supabaseClient) {
    try {

      if (error) {
        let res2 = await supabaseClient.from("clientes").insert([{ nome: nome, telefone: telefone }]).select();
        if (res2.data && res2.data[0]) {
          tempClient.id = res2.data[0].id;

      }
      safeSet(localStorage, "wa_clients", JSON.stringify(clients));
    } catch (err) {
      console.warn("Exceção Supabase:", err);
    }
  }
  alert("✅ Cliente cadastrado com sucesso!");
  syncFromSupabase();
}

// Escapa texto vindo do cadastro antes de inserir em HTML.
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Botão Agendar: abre a aba de visitas e preenche os dados do cliente.
function directVisit(nomeCodificado, telefoneCodificado, enderecoCodificado) {
  let nome = "", telefone = "", endereco = "";
  try {
    nome = decodeURIComponent(nomeCodificado || "");
    telefone = decodeURIComponent(telefoneCodificado || "");
    endereco = decodeURIComponent(enderecoCodificado || "");
  } catch (err) {
    nome = nomeCodificado || "";
    telefone = telefoneCodificado || "";
    endereco = enderecoCodificado || "";
  }
  setTab("visits");
  const nomeInput = document.getElementById("vNome");
  const telefoneInput = document.getElementById("vTelefone");
  const enderecoInput = document.getElementById("vEndereco");
  if (nomeInput) nomeInput.value = nome;
  if (telefoneInput) telefoneInput.value = telefone;
  if (enderecoInput) enderecoInput.value = endereco;
  const aparelhoInput = document.getElementById("vAparelho");
  if (aparelhoInput) aparelhoInput.focus();
}

// Botão WhatsApp: normaliza o número e abre uma conversa com mensagem pré-preenchida.
function openWaDirect(telefone, mensagem) {
  let numero = String(telefone || "").replace(/\D/g, "");
  if (!numero) {
    alert("Este cliente não possui telefone/WhatsApp cadastrado.");
    return;
  }
  if (!numero.startsWith("55")) numero = "55" + numero;
  const texto = String(mensagem || "Olá! Falamos da assistência técnica WA Resolve.");
  const url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
  window.open(url, "_blank");
}

async function updateClient(e, id) {
  e.preventDefault();
  const nome = document.getElementById("editCNome").value.trim();
  const telefone = document.getElementById("editCTelefone").value.trim();
  const endereco = document.getElementById("editCEndereco").value.trim();

  const c = clients.find(item => String(item.id) === String(id));
  if (c) {
    c.nome = nome;
    c.telefone = telefone;
    c.endereco = endereco;
    safeSet(localStorage, "wa_clients", JSON.stringify(clients));

    if (supabaseClient) {
      try {
        const { error } = await supabaseClient.from("clientes").update({ nome, telefone, endereco }).eq("id", id);
        if (error) {
          // Compatibilidade com tabelas antigas que ainda não possuem a coluna endereco.
          await supabaseClient.from("clientes").update({ nome, telefone }).eq("id", id);
        }
      } catch(err) {
        console.warn("Erro ao atualizar cliente:", err);
      }
    }

  document.querySelector(".modal").remove();
  alert("Cliente atualizado com sucesso!");
  renderDashboard();
}

  let url = (publicBaseUrl && publicBaseUrl.startsWith("http") ? publicBaseUrl.replace(/\/$/, "") : window.location.origin + window.location.pathname) + "?cliente=" + encodeURIComponent(id) + (clientLogoUrl ? "&logo=" + encodeURIComponent(clientLogoUrl) : "");
  navigator.clipboard.writeText(url).then(() => {
    alert("Link copiado para a área de transferência!\n\n" + url);
  }).catch(() => {
    prompt("Copie o link abaixo:", url);
  });
}

function changeOrderStatus(id) {
  const o = orders.find(item => item.id === id);
  if (!o) return;
  const novo = prompt("Novo status:\n1 - Aguardando aprovação\n2 - Aprovado - Conserto iniciado\n3 - Pronto para retirada\n4 - Concluído\n5 - Não aprovado", o.status);
  if (!novo) return;
  if (novo === "1") o.status = "Aguardando aprovação";
  else if (novo === "2") o.status = "Aprovado - Conserto iniciado";
  else if (novo === "3") o.status = "Pronto para retirada";
  else if (novo === "4") o.status = "Concluído";
  else if (novo === "5") o.status = "Não aprovado";
  else o.status = novo;
  
  safeSet(localStorage, "wa_orders", JSON.stringify(orders));
  if (supabaseClient && o.dbId) {
    supabaseClient.from("ordens_servico").update({ status: o.status }).eq("id", o.dbId);
  }
  renderDashboard();
}

function changePin() {
  const novo = prompt("Digite a nova Senha/PIN de administrador (mínimo 4 caracteres)", adminPin);
  if (novo && novo.trim().length >= 4) {
    adminPin = novo.trim();
    safeSet(localStorage, "wa_admin_pin", adminPin);
    alert("Senha alterada com sucesso!");
  }
}

function editCompanyWhatsApp() {
  const novo = prompt("Digite o número de WhatsApp oficial da sua assistência (com DDD, somente números):", companyWhatsApp || "849...");
  if (novo !== null) {
    companyWhatsApp = novo.replace(/\D/g, "");
    safeSet(localStorage, "wa_company_phone", companyWhatsApp);
    alert("WhatsApp da assistência salvo com sucesso!");
    renderDashboard();
  }
}

function changeOrderPhoto(id) {
  const o = orders.find(item => item.id === id);
  if (!o) return;
  const novoLink = prompt("Cole o link da foto do equipamento / defeito:", o.photoUrl || "");
  if (novoLink !== null) {
    o.photoUrl = novoLink.trim();
    safeSet(localStorage, "wa_orders", JSON.stringify(orders));
    if (supabaseClient && o.dbId) {
      supabaseClient.from("ordens_servico").update({ foto_url: o.photoUrl }).eq("id", o.dbId);
    }
    alert("Foto atualizada com sucesso!");
    renderDashboard();
  }
}
</script>
