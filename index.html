<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Resolve | Central de Serviços</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #102b50;
      --blue: #1d477a;
      --gold: #f3c44e;
      --ink: #172235;
      --muted: #6d7788;
      --line: #e3e8ef;
      --bg: #f4f7fb;
      --green: #198754;
      --red: #dc3545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .primary { background: var(--navy); color: #fff; }
    .secondary { background: #eaf0f8; color: var(--navy); }
    .gold { background: var(--gold); color: var(--navy); }
    .whatsapp-btn { background: #25d366; color: #fff; }
    .danger-btn { background: #fee2e2; color: var(--red); }
    
    .top {
      background: var(--navy);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo-img { height: 42px; width: auto; max-width: 110px; object-fit: contain; }
    .brand-badge {
      background: #fff;
      color: var(--navy);
      font-weight: 900;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .sb-badge {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 99px;
      font-weight: 700;
      cursor: pointer;
    }
    .sb-on { background: #d1fae5; color: #065f46; }
    .sb-off { background: #fee2e2; color: #991b1b; }
    
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #e2e8f0;
      padding: 6px;
      border-radius: 10px;
      margin: 16px 20px 0;
      flex-wrap: wrap;
    }
    .nav-tab {
      background: transparent;
      border: 0;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      color: var(--navy);
      cursor: pointer;
    }
    .nav-tab.active {
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat strong { display: block; font-size: 24px; margin-top: 4px; color: var(--navy); }
    
    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(320px, 1.2fr);
      gap: 16px;
    }
    @media(max-width: 850px) { .layout { grid-template-columns: 1fr; } }
    
    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 17px; margin-bottom: 14px; color: var(--navy); }
    
    .field { margin-bottom: 12px; display: grid; gap: 5px; position: relative; }
    .field label { font-size: 12px; font-weight: 700; color: #475569; }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 9px 12px;
      background: #fff;
    }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media(max-width: 500px) { .two { grid-template-columns: 1fr; } }
    
    .card-item {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--navy);
    }
    .tag.Aguardando_aprovação { background: #fef3c7; color: #92400e; }
    .tag.Aprovado_-_Conserto_iniciado, .tag.Em_conserto { background: #dbeafe; color: #1e40af; }
    .tag.Pronto_para_retirada, .tag.Concluído, .tag.Concluída, .tag.Confirmada { background: #d1fae5; color: #065f46; }
    .tag.Não_aprovado, .tag.Reagendar_/_Não_autorizado { background: #fee2e2; color: var(--red); }
    
    .modal {
      position: fixed; inset: 0; background: rgba(16,43,80,0.5);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 999;
    }
    .modal-box {
      background: #fff; border-radius: 14px; max-width: 480px; width: 100%; padding: 22px;
    }
    .lock-screen {
      max-width: 380px; margin: 80px auto; background: #fff; padding: 30px;
      border-radius: 16px; border: 1px solid var(--line); text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = "https://xuletvulgzdnuukynlhs.supabase.co";
const FIXED_SUPABASE_KEY = "sb_publishable_j7pad31FTUWcxR7NlpN4ng_HssGl2AC";

let supabaseClient = null;
try {
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, FIXED_SUPABASE_KEY);
  }
} catch(e) {
  console.warn("Supabase init error:", e);
}

let companyWhatsApp = localStorage.getItem("wa_company_phone") || "";
let companyLogoUrl = localStorage.getItem("wa_company_logo") || "";
let adminPin = localStorage.getItem("wa_admin_pin") || "1234";
let isUnlocked = sessionStorage.getItem("wa_unlocked") === "true";
let activeTab = localStorage.getItem("wa_active_tab") || "orders";

let orders = JSON.parse(localStorage.getItem("wa_orders") || "[]");
let clients = JSON.parse(localStorage.getItem("wa_clients") || "[]");
let visits = JSON.parse(localStorage.getItem("wa_visits") || "[]");

function formatarDataBR(dataIso) {
  if (!dataIso) return "";
  const partes = String(dataIso).split("T")[0].split("-");
  if (partes.length === 3) {
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }
  return dataIso;
}

window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const clienteId = params.get("cliente");
  const visitaId = params.get("visita");

  if (visitaId) {
    renderClientVisitView(visitaId);
  } else if (clienteId) {
    renderClientView(clienteId);
  } else if (!isUnlocked) {
    renderLockScreen();
  } else {
    renderDashboard();
  }

  if (supabaseClient) {
    syncFromSupabase();
  }
});

function syncFromSupabase() {
  if (!supabaseClient) return;
  supabaseClient.from("clientes").select("*").order("id", { ascending: false }).then(({ data: cData, error: cErr }) => {
    if (!cErr && cData && cData.length > 0) {
      clients = cData;
      localStorage.setItem("wa_clients", JSON.stringify(clients));
    }
  });

  supabaseClient.from("ordens_servico").select("*, clientes(*)").order("id", { ascending: false }).then(({ data: oData, error: oErr }) => {
    if (!oErr && oData && oData.length > 0) {
      orders = oData.map(d => ({
        id: "WR-" + d.id,
        dbId: d.id,
        name: d.clientes ? d.clientes.nome : "Cliente",
        phone: d.clientes ? d.clientes.telefone : "",
        appliance: d.titulo_servico || "Aparelho",
        brand: d.marca || "",
        problem: d.defeito || d.descricao || "",
        diagnosis: d.diagnostico || "",
        price: Number(d.orcamento) || 0,
        refusalFee: Number(d.taxa_recusa) || 0,
        photoUrl: d.foto_url || "",
        status: d.status || "Aguardando aprovação",
        created: d.created_at
      }));
      localStorage.setItem("wa_orders", JSON.stringify(orders));
    }
  });

  supabaseClient.from("visitas").select("*").order("id", { ascending: false }).then(({ data: vData, error: vErr }) => {
    if (!vErr && vData && vData.length > 0) {
      visits = vData.map(v => ({
        id: "VIS-" + v.id,
        dbId: v.id,
        cliente_nome: v.cliente_nome,
        telefone: v.telefone,
        endereco: v.endereco,
        data_visita: v.data_visita,
        horario_visita: v.horario_visita,
        aparelho_motivo: v.aparelho_motivo,
        observacoes: v.observacoes,
        motivo_recusa: v.motivo_recusa || "",
        status: v.status
      }));
      localStorage.setItem("wa_visits", JSON.stringify(visits));
    }
  });
}

function unlock(e) {
  e.preventDefault();
  const input = document.getElementById("pinInput").value.trim();
  if (input === adminPin) {
    isUnlocked = true;
    sessionStorage.setItem("wa_unlocked", "true");
    renderDashboard();
  } else {
    alert("Senha incorreta! A senha padrão é 1234.");
  }
}

function lock() {
  isUnlocked = false;
  sessionStorage.removeItem("wa_unlocked");
  renderLockScreen();
}

function setTab(tab) {
  activeTab = tab;
  localStorage.setItem("wa_active_tab", tab);
  renderDashboard();
}

function renderLockScreen() {
  const brandDisplay = companyLogoUrl 
    ? `<img src="${companyLogoUrl}" alt="Logo" style="max-height:48px; object-fit:contain;">` 
    : `<div class="brand-badge">WA RESOLVE</div>`;

  document.getElementById("app").innerHTML = `
    <header class="top">
      <div class="brand">
        ${brandDisplay}
        <span>Painel do Gestor</span>
      </div>
    </header>
    <div class="lock-screen">
      <div style="font-size:42px; margin-bottom:10px;">🔒</div>
      <h2 style="color:var(--navy); margin-bottom:6px;">Acesso Restrito</h2>
      <p style="color:var(--muted); font-size:13px; margin-bottom:18px;">Digite a sua senha para acessar as ordens, clientes e visitas técnicas.</p>
      <form onsubmit="unlock(event)">
        <div class="field">
          <input type="password" id="pinInput" placeholder="Senha (Padrão: 1234)" autofocus required style="text-align:center; font-size:18px; letter-spacing:3px;">
        </div>
        <button type="submit" class="primary" style="width:100%; margin-top:10px;">Entrar no Sistema</button>
      </form>
      <small style="display:block; margin-top:14px; color:var(--muted);">Senha padrão: <b>1234</b></small>
    </div>
  `;
}

function renderDashboard() {
  const sbStatus = supabaseClient 
    ? '<span class="sb-badge sb-on" onclick="openKeyModal()">● Nuvem Conectada</span>'
    : '<span class="sb-badge sb-off" onclick="openKeyModal()">⚡ Configurar</span>';

  const companyBadge = companyWhatsApp 
    ? `<span style="font-size:12px; color:#d1fae5; cursor:pointer;" onclick="editCompanyWhatsApp()">📲 Meu WhatsApp: ${companyWhatsApp}</span>`
    : `<button class="gold" style="font-size:11px; padding:4px 8px;" onclick="editCompanyWhatsApp()">⚠️ Configurar Meu WhatsApp</button>`;

  const brandDisplay = companyLogoUrl 
    ? `<img src="${companyLogoUrl}" class="brand-logo-img" alt="Logo">` 
    : `<div class="brand-badge">WA RESOLVE</div>`;

  const header = `
    <header class="top">
      <div class="brand">
        ${brandDisplay}
        <span style="font-weight:700; font-size:15px;">Central de Serviços</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        ${companyBadge}
        ${sbStatus}
        <button class="secondary" style="padding:6px 12px; font-size:12px;" onclick="openKeyModal()">🎨 Logo / Config</button>
        <button class="secondary" style="padding:6px 12px; font-size:12px;" onclick="changePin()">🔑 Senha</button>
        <button class="secondary" style="padding:6px 12px; font-size:12px;" onclick="lock()">Bloquear</button>
      </div>
    </header>
    <div class="nav-tabs">
      <button class="nav-tab ${activeTab==='orders'?'active':''}" onclick="setTab('orders')">📋 Ordens de Serviço</button>
      <button class="nav-tab ${activeTab==='clients'?'active':''}" onclick="setTab('clients')">👥 Meus Clientes</button>
      <button class="nav-tab ${activeTab==='visits'?'active':''}" onclick="setTab('visits')">📅 Agendamento de Visitas</button>
    </div>
  `;

  let body = "";
  if (activeTab === "clients") {
    body = renderClients();
  } else if (activeTab === "visits") {
    body = renderVisits();
  } else {
    body = renderOrders();
  }

  document.getElementById("app").innerHTML = header + '<div class="content">' + body + '</div>';
}

function renderOrders() {
  const awaiting = orders.filter(o => o.status === "Aguardando aprovação").length;
  const inProgress = orders.filter(o => o.status.includes("Aprovado") || o.status === "Em conserto").length;
  const refused = orders.filter(o => o.status === "Não aprovado");
  const totalRefusalFees = refused.reduce((sum, o) => sum + (Number(o.refusalFee) || 0), 0);

  return `
    <div class="stats">
      <div class="stat"><span>Total de Ordens</span><strong>${orders.length}</strong></div>
      <div class="stat"><span>Aguardando Aprovação</span><strong>${awaiting}</strong></div>
      <div class="stat"><span>Em Conserto / Aprovados</span><strong>${inProgress}</strong></div>
      <div class="stat" style="border-left:4px solid var(--red);">
        <span>Custos / Taxas de Não Aprovados</span>
        <strong style="color:var(--red);">R$ ${totalRefusalFees.toFixed(2)}</strong>
        <small style="font-size:11px; color:var(--muted);">${refused.length} orçamento(s) recusado(s)</small>
      </div>
    </div>
    
    <div class="layout">
      <div class="panel">
        <h2>＋ Cadastrar Nova Ordem</h2>
        <form onsubmit="saveOrder(event)">
          <div class="two">
            <div class="field">
              <label>Nome do Cliente *</label>
              <input id="osName" required placeholder="Digite ou selecione o cliente" list="clientListOptions" oninput="autoFillOrderClient(this.value)" onchange="autoFillOrderClient(this.value)">
              <datalist id="clientListOptions">
                ${clients.map(c => `<option value="${c.nome}">`).join('')}
              </datalist>
            </div>
            <div class="field">
              <label>WhatsApp do Cliente (com DDD) *</label>
              <input id="osPhone" required placeholder="Ex: 84999990000" inputmode="tel">
            </div>
          </div>
          <div class="two">
            <div class="field">
              <label>Aparelho *</label>
              <input id="osAppliance" required placeholder="Ex.: Geladeira Frost Free">
            </div>
            <div class="field">
              <label>Marca / Modelo</label>
              <input id="osBrand" placeholder="Ex.: Brastemp 400L">
            </div>
          </div>
          <div class="field">
            <label>Defeito Relatado</label>
            <textarea id="osProblem" rows="2" placeholder="O que o cliente informou?"></textarea>
          </div>
          <div class="field">
            <label>Diagnóstico Técnico / O que precisa</label>
            <textarea id="osDiagnosis" rows="2" placeholder="Peças, defeito real e serviços necessários"></textarea>
          </div>
          <div class="two">
            <div class="field">
              <label>Valor do Orçamento (R$) *</label>
              <input id="osPrice" required type="number" step="0.01" placeholder="0.00">
            </div>
            <div class="field">
              <label>Taxa por Não Aprovação (R$) *</label>
              <input id="osRefusalFee" required type="number" step="0.01" value="30.00" placeholder="Ex: 30.00">
              <small style="font-size:11px; color:var(--muted);">Custo cobrado se o cliente recusar o orçamento (análise/deslocamento).</small>
            </div>
          </div>
          <div class="field">
            <label>📷 Anexar Foto do Equipamento / Defeito do Cliente</label>
            <input type="file" id="osFile" accept="image/*" onchange="handleImageUpload(event)" style="padding:8px; background:#f8fafc; border:1px dashed #cbd5e1;">
            <input type="hidden" id="osPhoto" placeholder="Link ou imagem da foto">
            <div id="previewContainer" style="margin-top:8px; display:none; text-align:center; background:#f8fafc; padding:8px; border-radius:8px; border:1px solid var(--line);">
              <img id="imagePreview" src="" alt="Pré-visualização da foto" style="max-height:120px; max-width:100%; border-radius:6px; object-fit:contain;">
            </div>
            <small style="font-size:11px; color:var(--muted);">Escolha uma foto do seu computador ou cole o link da imagem abaixo:</small>
            <input id="osPhotoUrlDirect" placeholder="Ou cole a URL da imagem aqui" style="margin-top:4px;" oninput="document.getElementById('osPhoto').value=this.value">
          </div>
          <button type="submit" class="primary" style="width:100%; margin-top:8px;">Cadastrar e Salvar Ordem</button>
        </form>
      </div>

      <div class="panel">
        <h2>Ordens Cadastradas (${orders.length})</h2>
        <div>
          ${orders.length === 0 ? '<p style="color:var(--muted); text-align:center;">Nenhuma ordem registrada.</p>' : orders.slice().reverse().map(o => `
            <div class="card-item">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <strong>${o.name}</strong> <small style="color:var(--muted);">· ${o.id}</small>
                  <div style="font-size:13px; color:#334155; margin-top:2px;">${o.appliance} ${o.brand ? '· ' + o.brand : ''}</div>
                  <div style="font-size:12px; color:var(--muted);">WhatsApp: <strong>${o.phone || 'Não informado'}</strong></div>
                  ${o.refusalFee > 0 ? `<div style="font-size:11px; color:var(--red); margin-top:2px;">Taxa de recusa/custo: R$ ${Number(o.refusalFee).toFixed(2)}</div>` : ''}
                </div>
                <div style="text-align:right;">
                  <strong style="color:var(--navy);">R$ ${Number(o.price||0).toFixed(2)}</strong>
                  <div><span class="tag ${String(o.status).replace(/\s+/g, '_')}">${o.status}</span></div>
                </div>
              </div>
              ${o.photoUrl ? `<div style="margin-top:8px;"><a href="${o.photoUrl}" target="_blank" style="font-size:12px; color:var(--blue); font-weight:700;">📷 Ver Imagem do Defeito Cadastrada</a></div>` : ''}
              <div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;">
                <button class="whatsapp-btn" style="font-size:12px; padding:6px 12px;" onclick="sendOrderToClient('${o.phone}', '${o.id}', '${encodeURIComponent(o.name)}', '${encodeURIComponent(o.appliance)}', '${o.price}', '${encodeURIComponent(o.photoUrl||'')}', '${encodeURIComponent(o.diagnosis||o.problem||'')}')">📲 Enviar Orçamento e Foto no WhatsApp</button>
                <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="changeOrderPhoto('${o.id}')">📷 Alterar Imagem Defeito</button>
                <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="copyLink('${o.id}')">📋 Copiar Link</button>
                <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="changeOrderStatus('${o.id}')">🔄 Status</button>
                <button class="danger-btn" style="font-size:12px; padding:6px 10px;" onclick="deleteOrder('${o.id}')">🗑️ Excluir</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const base64String = e.target.result;
    document.getElementById("osPhoto").value = base64String;
    document.getElementById("osPhotoUrlDirect").value = "[Imagem anexada do computador]";
    const preview = document.getElementById("imagePreview");
    preview.src = base64String;
    document.getElementById("previewContainer").style.display = "block";
  };
  reader.readAsDataURL(file);
}

function renderClients() {
  return `
    <div class="layout">
      <div class="panel">
        <h2>＋ Novo Cliente</h2>
        <form onsubmit="saveClient(event)">
          <div class="field">
            <label>Nome Completo *</label>
            <input id="cNome" required placeholder="Ex.: Francisca Silva">
          </div>
          <div class="field">
            <label>Telefone / WhatsApp com DDD *</label>
            <input id="cTelefone" required placeholder="Ex.: 84988887777" inputmode="tel">
          </div>
          <div class="field">
            <label>Endereço Completo (Rua, Número, Bairro)</label>
            <textarea id="cEndereco" rows="3" placeholder="Ex.: Rua das Flores, 150, Bairro Abolição"></textarea>
          </div>
          <button type="submit" class="primary" style="width:100%; margin-top:8px;">Salvar Cliente</button>
        </form>
      </div>

      <div class="panel">
        <h2>Meus Clientes (${clients.length})</h2>
        <div>
          ${clients.length === 0 ? '<p style="color:var(--muted); text-align:center;">Nenhum cliente cadastrado ainda.</p>' : clients.slice().reverse().map(c => `
            <div class="card-item" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
              <div style="flex:1; min-width:185px;">
                <strong style="font-size:15px; color:var(--navy);">${c.nome}</strong>
                <p style="font-size:13px; color:var(--muted); margin:2px 0;">📱 ${c.telefone || 'Sem telefone'}</p>
                <p style="font-size:13px; color:#334155;">📍 ${c.endereco || 'Endereço não informado'}</p>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="directVisit('${encodeURIComponent(c.nome)}', '${encodeURIComponent(c.telefone||'')}', '${encodeURIComponent(c.endereco||'')}')">📅 Agendar</button>
                <button class="whatsapp-btn" style="font-size:12px; padding:6px 10px;" onclick="openWaDirect('${c.telefone}', 'Olá ${encodeURIComponent(c.nome)}! Falamos da assistência técnica WA Resolve.')">💬 WhatsApp</button>
                <button class="secondary" style="font-size:12px; padding:6px 10px;" onclick="editClient('${c.id}')">✏️ Editar</button>
                <button class="danger-btn" style="font-size:12px; padding:6px 10px;" onclick="deleteClient('${c.id}', '${encodeURIComponent(c.nome)}')">🗑️ Excluir</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

function handleVisitClientSelect(valorDigitado) {
  if (!valorDigitado) return;
  const termo = valorDigitado.trim().toLowerCase();
  const c = clients.find(item => item.nome && item.nome.trim().toLowerCase() === termo);
  if (c) {
    if (c.telefone) document.getElementById("vTelefone").value = c.telefone;
    if (c.endereco) document.getElementById("vEndereco").value = c.endereco;
  }
}

function autoFillOrderClient(valorDigitado) {
  if (!valorDigitado) return;
  const termo = valorDigitado.trim().toLowerCase();
  const c = clients.find(item => item.nome && item.nome.trim().toLowerCase() === termo);
  if (c && c.telefone) {
    document.getElementById("osPhone").value = c.telefone;
  }
}

function sendOrderToClient(clientPhone, orderId, clientName, appliance, price, photoUrl, details) {
  const cleanPhone = (clientPhone || "").replace(/\D/g, "");
  if (!cleanPhone) {
    alert("Esta ordem não possui o WhatsApp do cliente cadastrado.");
    return;
  }
  
  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(appliance);
  const detalhesTxt = decodeURIComponent(details || "");

  const publicBaseUrl = localStorage.getItem("wa_public_url") || "";
  const activeBase = publicBaseUrl && publicBaseUrl.startsWith("http") ? publicBaseUrl : window.location.origin + window.location.pathname;
  const urlOs = activeBase.replace(/\/$/, "") + "?cliente=" + orderId;

  const texto = 
`Olá, *${nomeCliente}*! Segue o link de visualização da sua Ordem (${orderId}) referente ao conserto do seu(sua) *${nomeAparelho}* na WA Resolve:

💰 *Valor:* R$ ${Number(price).toFixed(2)}
${detalhesTxt ? `🛠️ *Serviço:* ${detalhesTxt}\n` : ""}
👉 *Clique no link abaixo para ver a foto do equipamento, detalhes e aprovar online:*
${urlOs}`;

  const fullPhone = cleanPhone.startsWith("55") ? cleanPhone : "55" + cleanPhone;
  const url = `https://wa.me/${fullPhone}?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
}

function sendVisitConfirmationToWhatsApp(phone, clientName, dataIso, horario, aparelho, visitId) {
  const cleanPhone = (phone || "").replace(/\D/g, "");
  if (!cleanPhone) {
    alert("Esta visita não possui o WhatsApp do cliente cadastrado.");
    return;
  }
  
  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(aparelho || "Equipamento");
  const horarioTxt = decodeURIComponent(horario);
  const dataFormatada = formatarDataBR(dataIso);

  const publicBaseUrl = localStorage.getItem("wa_public_url") || "";
  const activeBase = publicBaseUrl && publicBaseUrl.startsWith("http") ? publicBaseUrl : window.location.origin + window.location.pathname;
  const urlVisita = activeBase.replace(/\/$/, "") + "?visita=" + visitId;

  const texto = 
`Olá, *${nomeCliente}*! Confirmando a visita técnica da WA Resolve no dia ${dataFormatada} no horário ${horarioTxt}.

👉 *Clique para responder SIM ou NÃO online:*
${urlVisita}`;

  const fullPhone = cleanPhone.startsWith("55") ? cleanPhone : "55" + cleanPhone;
  const url = `https://wa.me/${fullPhone}?text=${encodeURIComponent(texto)}`;
  window.open(url, "_blank");
}

function renderClientView(id) {
  document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Carregando orçamento...</h2></div>`;

  let o = orders.find(item => String(item.id).toUpperCase() === String(id).toUpperCase() || String(item.dbId) === String(id));

  if (!o && supabaseClient) {
    supabaseClient.from("ordens_servico").select("*, clientes(*)").then(({data}) => {
      if (data) {
        const found = data.find(d => String(d.id) === String(id).replace(/\D/g, "") || "WR-" + d.id === String(id));
        if (found) {
          o = {
            id: "WR-" + found.id,
            dbId: found.id,
            name: found.clientes ? found.clientes.nome : "Cliente",
            phone: found.clientes ? found.clientes.telefone : "",
            appliance: found.titulo_servico || "Aparelho",
            brand: found.marca || "",
            problem: found.defeito || found.descricao || "",
            diagnosis: found.diagnostico || "",
            price: Number(found.orcamento) || 0,
            refusalFee: Number(found.taxa_recusa) || 0,
            photoUrl: found.foto_url || "",
            status: found.status || "Aguardando aprovação"
          };
          displayClientOrderPage(o);
          return;
        }
      }
      document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Ordem não encontrada</h2></div>`;
    });
    return;
  }

  if (o) {
    displayClientOrderPage(o);
  } else {
    document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Ordem não encontrada</h2></div>`;
  }
}

function renderClientVisitView(id) {
  document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Carregando visita...</h2></div>`;

  let v = visits.find(item => String(item.id).toUpperCase() === String(id).toUpperCase() || String(item.dbId) === String(id));

  if (!v && supabaseClient) {
    supabaseClient.from("visitas").select("*").then(({data}) => {
      if (data && data.length > 0) {
        let found = data.find(item => String(item.id) === String(id).replace(/\D/g, "") || "VIS-" + item.id === String(id));
        if (!found) found = data[0];
        if (found) {
          v = {
            id: "VIS-" + found.id,
            dbId: found.id,
            cliente_nome: found.cliente_nome,
            telefone: found.telefone,
            endereco: found.endereco,
            data_visita: found.data_visita,
            horario_visita: found.horario_visita,
            aparelho_motivo: found.aparelho_motivo,
            observacoes: found.observacoes,
            motivo_recusa: found.motivo_recusa || "",
            status: found.status
          };
          displayClientVisitPage(v);
          return;
        }
      }
      document.getElementById("app").innerHTML = `<div style="text-align:center; padding:60px;"><h2>Visita não encontrada</h2></div>`;
    });
    return;

  if (v) {
    displayClientVisitPage(v);

}
