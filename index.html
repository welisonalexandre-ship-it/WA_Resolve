function safeLocalArray(key, defaultValue = "[]") {
  try { const result = JSON.parse(localStorage.getItem(key) || defaultValue); return Array.isArray(result) ? result : []; }
  catch (e) { console.error("Dados locais inválidos em " + key, e); return []; }
}
function htmlEscape(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error("Falha de armazenamento local", e); alert("Não foi possível salvar uma cópia local. Libere espaço no navegador ou exporte os dados."); return false; }
}

}

function formatarDataBR(dataIso) {
  if (!dataIso) return "-";
  const partes = String(dataIso).split("T")[0].split("-");
  if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;

}

function getNextShortOrderId() {
  let maxNum = 100;
  orders.forEach(o => {
    const m = String(o.id || "").match(/WR-(\d+)/);
    if (m && m[1]) {
      const val = parseInt(m[1], 10);
      if (val > maxNum) maxNum = val;
    }
  });
  return "WR-" + (maxNum + 1);
}

function compressAndResizeImage(file, maxWidth = 1000, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
}

function crc16(str) {
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
      else crc = crc << 1;
    }
  }
  return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, "0");
}

function emvField(id, val) {
  const v = String(val);
  return `${id}${String(v.length).padStart(2, "0")}${v}`;
}

function gerarPixPayload(chave, valor, beneficiario = "WA RESOLVE", cidade = "MOSSORO", txid = "***") {
  if (!chave) return "";
  const cleanPix = chave.trim();
  const accInfo = emvField("00", "BR.GOV.BCB.PIX") + emvField("01", cleanPix);
  let payload = emvField("00", "01") + emvField("26", accInfo) + emvField("52", "0000") + emvField("53", "986");
  if (Number(valor) > 0) payload += emvField("54", Number(valor).toFixed(2));
  payload += emvField("58", "BR") + emvField("59", beneficiario.slice(0, 25)) + emvField("60", cidade.slice(0, 15)) + emvField("62", emvField("05", txid)) + "6304";
  return payload + crc16(payload);
}

async function syncFromSupabase() {
  if (!supabaseClient || !isUnlocked) return;
  // Nunca descartar ordens offline ao ler a nuvem.
  const localOnly = orders.filter(o => o.localOnly || !o.dbId);
  try {
    const [cResult,oResult,vResult]=await Promise.all([
      supabaseClient.from("clientes").select("*").order("id",{ascending:false}),
      supabaseClient.from("ordens_servico").select("*, clientes(*)").order("id",{ascending:false}),
      supabaseClient.from("visitas").select("*").order("id",{ascending:false})
    ]);
    const errors=[cResult.error,oResult.error,vResult.error].filter(Boolean);
    if(errors.length){cloudReadFailed=true; addSyncWarning('⚠️ Falha ao consultar a nuvem. Exibindo dados armazenados neste dispositivo. Confirme permissões RLS e conexão.'); console.error(errors);return;}
    clients=cResult.data.map(c=>({id:c.id,nome:c.nome,telefone:c.telefone||"",endereco:c.endereco||""}));
    const cloudOrders=oResult.data.map(d=>({
      id:"WR-"+d.id, dbId:d.id,
      name:d.clientes?d.clientes.nome:"Cliente",phone:d.clientes?d.clientes.telefone:"",
      appliance:d.titulo_servico||"Aparelho",partsUsed:d.pecas_usadas||[],
      brand:d.marca||"",serialNumber:d.numero_serie||"",sealNumber:d.numero_lacre||"",
      checklistDamages:d.avarias_iniciais||"",accessoriesLeft:d.acessorios_deixados||"",
      problem:d.defeito||d.descricao||"",diagnosis:d.diagnostico||"",
      price:Number(d.orcamento)||0,refusalFee:d.taxa_recusa==null?50:Number(d.taxa_recusa),
      entryFee:Number(d.valor_entrada)||0,paymentMethod:d.forma_pagamento||"Pix",
      photoUrlEntry:d.foto_entrada||d.foto_url||"",photoUrlDefect:d.foto_defeito||"",
      status:d.status||(Number(d.orcamento)>0?"Aguardando aprovação":"Em análise técnica"),
      created:d.created_at,data_conclusao:d.data_conclusao||'',dias_garantia:d.dias_garantia==null?90:Number(d.dias_garantia)
    }));
    orders=[...cloudOrders,...localOnly.filter(l=>!cloudOrders.some(c=>c.id===l.id))];
    visits=vResult.data.map(v=>({
      id:"VIS-"+v.id,dbId:v.id,cliente_nome:v.cliente_nome,telefone:v.telefone,endereco:v.endereco,
      data_visita:v.data_visita,horario_visita:v.horario_visita,aparelho_motivo:v.aparelho_motivo,
      observacoes:v.observacoes,motivo_recusa:v.motivo_recusa||"",status:v.status||"Agendada"
    }));
    saveLocal("wa_clients",clients);saveLocal("wa_orders",orders);saveLocal("wa_visits",visits);
    cloudLoaded=true;cloudReadFailed=false;
    if(isUnlocked) renderDashboard();
    if(localOnly.length) addSyncWarning('⚠️ Há ordens salvas apenas neste dispositivo. Faça um backup e regularize antes de limpar dados do navegador.');
  }catch(e){cloudReadFailed=true;console.error(e);addSyncWarning('⚠️ Conexão com a nuvem falhou. Dados locais preservados.');}
}

      </div>

  return `

      </div>

async function saveClient(e) {
  e.preventDefault();
  const nome = document.getElementById("cNome").value.trim();
  const telefone = document.getElementById("cTelefone").value.trim();
  const endereco = document.getElementById("cEndereco").value.trim();
  
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.from("clientes").insert([{ nome, telefone, endereco }]).select().single();
      if (error) throw error;
      if (data) {
        clients.push(data);
        localStorage.setItem("wa_clients", JSON.stringify(clients));
        alert("✅ Cliente cadastrado com sucesso!");
        renderDashboard();
        return;
      }
    } catch(err) { cloudError("Cadastro de cliente",err); return; }
  }

  clients.push({ id: Date.now(), nome, telefone, endereco, localOnly:true });
  localStorage.setItem("wa_clients", JSON.stringify(clients));
  alert("✅ Cliente cadastrado localmente!");
  renderDashboard();
}

function editClient(id) {
  const c = clients.find(x => String(x.id) === String(id));
  if (!c) return;

  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div class="modal-box">
      <h3 style="color:var(--navy); margin-bottom:14px;">✏️ Editar Dados do Cliente</h3>
      <div class="field"><label>Nome Completo *</label><input id="editClienteNome" value="${c.nome || ''}"></div>
      <div class="field"><label>Telefone / WhatsApp *</label><input id="editClienteTel" value="${c.telefone || ''}" inputmode="tel"></div>
      <div class="field"><label>Endereço Completo</label><textarea id="editClienteEnd" rows="2">${c.endereco || ''}</textarea></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button class="secondary" onclick="this.closest('.modal').remove()">Cancelar</button>
        <button class="primary" onclick="saveClientEdit('${c.id}', this)">Salvar Alterações</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveClientEdit(id,btn) {
  const c=clients.find(x=>String(x.id)===String(id));if(!c)return;
  const changes={nome:document.getElementById("editClienteNome").value.trim(),telefone:document.getElementById("editClienteTel").value.trim(),endereco:document.getElementById("editClienteEnd").value.trim()};
  if(!changes.nome||!changes.telefone)return alert('Preencha nome e telefone.');
  if(supabaseClient && !c.localOnly){
    try {const {data,error}=await supabaseClient.from("clientes").update(changes).eq("id",c.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Banco não confirmou a atualização (verifique RLS).');}
    catch(err){cloudError('Atualização do cliente',err);return;}
  }
  Object.assign(c,changes);saveLocal('wa_clients',clients);btn.closest('.modal').remove();alert(c.localOnly?'Cliente alterado apenas neste dispositivo.':'Cliente atualizado.');renderDashboard();
}

async function deleteClient(id) {
  if(!confirm('ATENÇÃO: excluir cliente pode afetar ordens associadas. Deseja continuar?'))return;
  const c=clients.find(x=>String(x.id)===String(id));if(!c)return;
  if(supabaseClient&&!c.localOnly){
    try{const {data,error}=await supabaseClient.from('clientes').delete().eq('id',id).select('id');if(error)throw error;if(!data?.length)throw new Error('Exclusão não confirmada.');}
    catch(err){cloudError('Exclusão do cliente',err);return;}
  }
  clients=clients.filter(x=>String(x.id)!==String(id));saveLocal('wa_clients',clients);renderDashboard();
}

async function handleEntryImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const compressedBase64 = await compressAndResizeImage(file);
    document.getElementById("osPhotoEntry").value = compressedBase64;
    const preview = document.getElementById("imagePreviewEntry");
    preview.src = compressedBase64;
    document.getElementById("previewEntryContainer").style.display = "block";
  } catch(err) { console.error("Erro ao comprimir imagem:", err); }
}

function openQuickMessagesModal(id) {
  const o = orders.find(item => String(item.id) === String(id));
  if (!o) return;
  const cleanPhone = (o.phone || "").replace(/\D/g, "");
  if (!cleanPhone) return alert("Esta ordem não possui telefone cadastrado.");
  const fullPhone = cleanPhone.startsWith("55") ? cleanPhone : "55" + cleanPhone;
  const preco = Number(o.price || 0), entrada = Number(o.entryFee || 0), restante = Math.max(0, preco - entrada);

  const msgPronto = encodeURIComponent(`Olá, *${o.name}*! Tudo bem? Passando para avisar que o seu(sua) *${o.appliance}* (${o.brand || ''}) já está pronto e 100% testado na *WA Resolve*! 🛠️✅\n\n${restante > 0 ? `💰 *Saldo restante:* ${formatBRL(restante)}\n` : ''}🛡️ *Garantia:* ${o.dias_garantia || 90} dias.`);
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div class="modal-box">

async function saveOrder(e) {
  e.preventDefault();
  const name = document.getElementById("osName").value.trim();
  const phone = document.getElementById("osPhone").value.trim();
  const appliance = document.getElementById("osAppliance").value.trim();
  const brand = document.getElementById("osBrand").value.trim();
  const serialNumber = document.getElementById("osSerial").value.trim();
  const sealNumber = document.getElementById("osSeal").value.trim();
  const price = parseFloat(document.getElementById("osPrice").value) || 0;
  const refusalFee = parseFloat(document.getElementById("osRefusalFee").value) || 50.00;
  const problem = document.getElementById("osProblem").value.trim();
  const photoUrlEntry = document.getElementById("osPhotoEntry").value.trim();
  const status = price > 0 ? "Aguardando aprovação" : "Em análise técnica";

  let cId = null;
  if (supabaseClient) {
    try {
      const { data: cRes, error: findClientError } = await supabaseClient.from("clientes").select("id").eq("nome", name).eq("telefone", phone).limit(1);
      if (findClientError) throw findClientError;
      if (cRes && cRes.length > 0) cId = cRes[0].id;
      else {
        const { data: newC, error: createClientError } = await supabaseClient.from("clientes").insert([{ nome: name, telefone: phone }]).select("id").single();
        if(createClientError) throw createClientError;
        if (newC) cId = newC.id;
      }
      const { data: osRes, error } = await supabaseClient.from("ordens_servico").insert([{
        cliente_id: cId, titulo_servico: appliance, marca: brand, numero_serie: serialNumber, numero_lacre: sealNumber,
        defeito: problem, foto_entrada: photoUrlEntry, status: status, orcamento: price, taxa_recusa: refusalFee
      }]).select("id").single();
      if (error) throw error;
      if (!osRes?.id) throw new Error("Ordem não foi confirmada pelo banco.");
      if (osRes) {
        orders.push({ id: "WR-" + osRes.id, dbId: osRes.id, name, phone, appliance, brand, serialNumber, sealNumber, problem, photoUrlEntry, status, price, refusalFee });
        localStorage.setItem("wa_orders", JSON.stringify(orders));
        alert("✅ Ordem WR-" + osRes.id + " salva com sucesso na nuvem!");
        renderDashboard(); return;
      }
    } catch(err) { cloudError("Salvar ordem",err); return; }
  }

  const shortId = getNextShortOrderId();
  orders.push({ id: shortId, name, phone, appliance, brand, serialNumber, sealNumber, problem, photoUrlEntry, status, price, refusalFee, localOnly: true });
  localStorage.setItem("wa_orders", JSON.stringify(orders));
  addSyncWarning("⚠️ Esta ordem está apenas neste dispositivo. Faça backup e sincronize antes de compartilhar.");
  alert("⚠️ Ordem " + shortId + " salva SOMENTE neste dispositivo. O cliente não poderá consultá-la por link.");
  renderDashboard();
}

async function saveOrderBancada(id,dbId,btn) {
 const o=orders.find(item=>String(item.id)===String(id));if(!o)return;
 const problem=document.getElementById('editProblem').value.trim(),diagnosis=document.getElementById('editDiagnosis').value.trim(),price=Number(document.getElementById('editPrice').value)||0,refusalFee=Number(document.getElementById('editRefusalFee').value)||0;
 const status=(price>0&&o.status==='Em análise técnica')?'Aguardando aprovação':o.status;
 const realDbId=dbId||o.dbId;
 if(supabaseClient&&realDbId){
  try {const {data,error}=await supabaseClient.from('ordens_servico').update({defeito:problem,diagnostico:diagnosis,orcamento:price,taxa_recusa:refusalFee,status}).eq('id',realDbId).select('id');if(error)throw error;if(!data?.length)throw new Error('Atualização não confirmada pelo banco.');}
  catch(err){cloudError('Salvar orçamento',err);return;}
 } else if(supabaseClient&&!realDbId){return alert('⚠️ Esta ordem não tem ID da nuvem. Exporte o backup antes de tentar sincronizar.');}
 Object.assign(o,{problem,diagnosis,price,refusalFee,status});saveLocal('wa_orders',orders);btn.closest('.modal').remove();alert(realDbId?'✅ Orçamento atualizado na nuvem!':'⚠️ Orçamento atualizado somente neste dispositivo.');renderDashboard();
}

 if(novo===null||!novo.trim())return;
 const statuses={'1':'Em análise técnica','2':'Aguardando aprovação','3':'Aprovado - Conserto iniciado','4':'Pronto para retirada','5':'Concluído','6':'Não aprovado'};
 const status=statuses[novo]||novo;
 const data_conclusao=status==='Concluído'?new Date().toISOString().split('T')[0]:(o.data_conclusao||null);
 if(supabaseClient&&o.dbId){try{const {data,error}=await supabaseClient.from('ordens_servico').update({status,data_conclusao}).eq('id',o.dbId).select('id');if(error)throw error;if(!data?.length)throw new Error('Mudança de status não confirmada.');}catch(err){cloudError('Alterar status',err);return;}}
 else if(supabaseClient)return alert('Esta ordem está apenas no dispositivo; exporte o backup antes de mudar seu status.');
 o.status=status;o.data_conclusao=data_conclusao;saveLocal('wa_orders',orders);renderDashboard();
}
async function deleteOrder(id) {

 if(supabaseClient&&o.dbId){try{const {data,error}=await supabaseClient.from('ordens_servico').delete().eq('id',o.dbId).select('id');if(error)throw error;if(!data?.length)throw new Error('Exclusão não confirmada pelo banco.');}catch(err){cloudError('Excluir ordem',err);return;}}
 orders=orders.filter(item=>item.id!==id);saveLocal('wa_orders',orders);renderDashboard();
}

function renderClientView(id) {
  const app = document.getElementById('app');
  app.innerHTML = '<div style="text-align:center;padding:60px"><h2>Consultando a ordem no Supabase...</h2></div>';
  const rawId=String(id||'').trim();
  const cleanId=rawId.replace(/^WR-/i,'').trim();
  const diagnose=(code,extra='')=>`WA Resolve v1.2 | ${code}\nIdentificador: ${/^[0-9]+$/.test(cleanId)?cleanId:'inválido'}\nSite: ${location.origin+location.pathname}\nHorário: ${new Date().toLocaleString('pt-BR')}\n${extra}`;
  if (!/^\d+$/.test(cleanId)) {
    renderClientFailure('Link de ordem inválido','O link não contém um número de ordem válido. Solicite um novo link pelo botão “Copiar Link” do painel.',diagnose('LINK_INVALIDO'));
    return;
  }
  if (!supabaseClient) {
    renderClientFailure('Conexão indisponível','A biblioteca do Supabase não carregou neste dispositivo. Confira a internet e tente atualizar a página.',diagnose('SUPABASE_NAO_INICIALIZADO'));
    return;
  }
  supabaseClient.from('ordens_servico').select('*, clientes(*)').eq('id',cleanId).maybeSingle().then(({data,error})=>{
    if(error) {
      console.error('WA Resolve consulta pública',error);
      const errorCode=String(error.code||'SEM_CODIGO');
      renderClientFailure('Falha ao consultar a ordem','O banco recusou ou não conseguiu completar a consulta. O administrador precisa conferir as permissões e a conexão do Supabase.',diagnose('ERRO_BANCO',`Código: ${errorCode}\nDetalhe: ${String(error.message||'erro desconhecido').slice(0,350)}`));
      return;
    }
    if(!data){
      renderClientFailure('Ordem não disponível para consulta','A ordem pode não existir na nuvem ou a política de segurança (RLS) pode impedir que o celular a visualize. Esses dois casos não podem ser distinguidos com segurança pelo link público.',diagnose('SEM_RESULTADO_OU_RLS',`Teste: localizar a OS WR-${cleanId} no painel e confirmar no Supabase SQL Editor se existe uma linha com id=${cleanId}.`));
      return;
    }
    const o = {
      id:'WR-'+data.id,dbId:data.id,name:data.clientes?data.clientes.nome:'Cliente',
      appliance:data.titulo_servico||'Aparelho',brand:data.marca||'',
      problem:data.defeito||data.descricao||'',diagnosis:data.diagnostico||'',
      price:Number(data.orcamento)||0,refusalFee:data.taxa_recusa==null?50:Number(data.taxa_recusa),
      entryFee:Number(data.valor_entrada)||0,photoUrlDefect:data.foto_defeito||data.foto_entrada||'',
      status:data.status||'Aguardando aprovação',dias_garantia:data.dias_garantia||90
    };
    displayClientOrderPage(o);
  }).catch(err=>{
    console.error('WA Resolve rede consulta pública',err);
    renderClientFailure('Sem resposta do servidor','Não foi possível comunicar com o banco. Verifique a internet do celular e tente novamente.',diagnose('FALHA_REDE',String(err?.message||'Sem detalhes').slice(0,250)));
  });
}

async function clientActionOrder(id,newStatus,dbId) {
 if(!['Aprovado - Conserto iniciado','Não aprovado'].includes(newStatus))return;
 if(!confirm(newStatus==='Não aprovado'?'Confirma que NÃO aprova este orçamento?':'Confirma a aprovação deste orçamento?'))return;
 if(!supabaseClient||!dbId)return alert('Sem conexão configurada com o banco. Sua resposta NÃO foi registrada.');
 try {
   const {data,error}=await supabaseClient.from('ordens_servico').update({status:newStatus}).eq('id',dbId).eq('status','Aguardando aprovação').select('id');
   if(error)throw error;
   if(!data?.length)throw new Error('Não foi possível registrar a decisão. O status pode ter mudado ou a política do banco bloqueou a atualização.');
   alert('✅ Resposta registrada na nuvem!');renderClientView(dbId);
 }catch(err){cloudError('Registrar decisão do cliente',err);}
}

function sendOrderToClient(clientPhone, orderId, clientName, appliance, price, photoUrl, details) {
  const cleanPhone = (clientPhone || "").replace(/\D/g, "");
  if (!cleanPhone) return alert("Esta ordem não possui WhatsApp cadastrado.");
  const dbId = getOrderDatabaseId(orderId);
  if (!dbId) return alert("Esta ordem precisa estar salva na nuvem para enviar o link.");

  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(appliance);
  const detalhesTxt = decodeURIComponent(details || "");
  const urlOs = getPublicSiteBaseUrl().replace(/\/$/, "") + "/#cliente=" + encodeURIComponent(dbId);

  const texto = `Olá, *${nomeCliente}*! Segue o link de visualização da sua Ordem (*${orderId}*) referente ao conserto do seu(sua) *${nomeAparelho}* na *WA Resolve*:\n\n💰 *Valor:* ${Number(price) > 0 ? formatBRL(price) : 'Em análise'}\n${detalhesTxt ? `🛠️ *Serviço:* ${detalhesTxt}\n` : ''}\n⚠️ *Nota:* Caso o orçamento não seja aprovado, incide taxa de análise no valor de R$ 50,00.\n\n👉 *Clique no link para ver detalhes e aprovar online:*\n${urlOs}`;
  window.open(`https://wa.me/55${cleanPhone}?text=${encodeURIComponent(texto)}`, '_blank');
}

function printOrderSheet(id) {
  const o = orders.find(item => String(item.id) === String(id));
  if (!o) return;
  const pa = document.getElementById("printArea");
  pa.innerHTML = `<div style="font-family:Arial; padding:20px;"><h2>WA RESOLVE - ORDEM ${o.id}</h2><p><strong>Cliente:</strong> ${o.name}</p><p><strong>Aparelho:</strong> ${o.appliance}</p><p><strong>Defeito:</strong> ${o.problem}</p><p><strong>Serviço/Diagnóstico:</strong> ${o.diagnosis}</p><p><strong>Valor:</strong> ${formatBRL(o.price)}</p><p><strong>Taxa de recusa/análise:</strong> R$ 50,00</p></div>`;
  window.print();
}

function autoFillOrderClient(val) {
  const c = clients.find(x => x.nome && x.nome.toLowerCase() === val.toLowerCase());
  if (c && c.telefone) document.getElementById("osPhone").value = c.telefone;
}
</script>
</body>
</html>
