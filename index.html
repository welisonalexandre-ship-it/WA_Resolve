function formatarDataBR(dataIso) {
  if (!dataIso) return "-";
  const partes = String(dataIso).split("T")[0].split("-");
  if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
  return dataIso;
}

function formatBRL(valor) {

function getNextShortOrderId() {
  let maxNum = 100;
  orders.forEach(o => {

      const val = parseInt(m[1], 10);
      if (val > maxNum) maxNum = val;
    }
  });
  return "WR-" + (maxNum + 1);
}

function compressAndResizeImage(file, maxWidth = 1000, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
      const img = new Image();
      img.src = event.target.result;
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = error => reject(error);
    };
    reader.onerror = error => reject(error);
  });
}

function crc16(str) {
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
      else crc = crc << 1;
    }
  }
  return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, "0");
}

function emvField(id, val) {
  const v = String(val);
  return `${id}${String(v.length).padStart(2, "0")}${v}`;
}

function gerarPixPayload(chave, valor, beneficiario = "WA RESOLVE", cidade = "MOSSORO", txid = "***") {
  if (!chave) return "";
  const cleanPix = chave.trim();
  const accInfo = emvField("00", "BR.GOV.BCB.PIX") + emvField("01", cleanPix);
  let payload = emvField("00", "01") + emvField("26", accInfo) + emvField("52", "0000") + emvField("53", "986");
  if (Number(valor) > 0) payload += emvField("54", Number(valor).toFixed(2));
  payload += emvField("58", "BR") + emvField("59", beneficiario.slice(0, 25)) + emvField("60", cidade.slice(0, 15)) + emvField("62", emvField("05", txid)) + "6304";
  return payload + crc16(payload);
}

      localStorage.setItem("wa_orders", JSON.stringify(orders));
      if (isUnlocked && (activeTab === 'orders' || activeTab === 'history' || activeTab === 'balance')) renderDashboard();
    }
  });

  supabaseClient.from("visitas").select("*").order("id", { ascending: false }).then(({ data: vData }) => {
    if (vData && vData.length > 0) {

  const msgPronto = encodeURIComponent(`Olá, *${o.name}*! Tudo bem? Passando para avisar que o seu(sua) *${o.appliance}* (${o.brand || ''}) já está pronto e 100% testado na *WA Resolve*! 🛠️✅\n\n${restante > 0 ? `💰 *Saldo restante:* ${formatBRL(restante)}\n` : ''}🛡️ *Garantia:* ${o.dias_garantia || 90} dias.`);

  modal.innerHTML = `

async function saveOrder(e) {
  e.preventDefault();
  const name = document.getElementById("osName").value.trim();
  const phone = document.getElementById("osPhone").value.trim();
  const appliance = document.getElementById("osAppliance").value.trim();
  const brand = document.getElementById("osBrand").value.trim();
  const serialNumber = document.getElementById("osSerial").value.trim();
  const sealNumber = document.getElementById("osSeal").value.trim();
  const price = parseFloat(document.getElementById("osPrice").value) || 0;
  const refusalFee = parseFloat(document.getElementById("osRefusalFee").value) || 50.00;
  const problem = document.getElementById("osProblem").value.trim();
  const photoUrlEntry = document.getElementById("osPhotoEntry").value.trim();
  const status = price > 0 ? "Aguardando aprovação" : "Em análise técnica";

  let cId = null;
  if (supabaseClient) {
    try {
      const { data: cRes } = await supabaseClient.from("clientes").select("id").eq("nome", name).limit(1);
      if (cRes && cRes.length > 0) cId = cRes[0].id;
      else {
        const { data: newC } = await supabaseClient.from("clientes").insert([{ nome: name, telefone: phone }]).select("id").single();
        if (newC) cId = newC.id;
      }
      const { data: osRes, error } = await supabaseClient.from("ordens_servico").insert([{
        cliente_id: cId, titulo_servico: appliance, marca: brand, numero_serie: serialNumber, numero_lacre: sealNumber,
        defeito: problem, foto_entrada: photoUrlEntry, status: status, orcamento: price, taxa_recusa: refusalFee
      }]).select("id").single();
      if (error) throw error;
      if (osRes) {
        orders.push({ id: "WR-" + osRes.id, dbId: osRes.id, name, phone, appliance, brand, serialNumber, sealNumber, problem, photoUrlEntry, status, price, refusalFee });
        localStorage.setItem("wa_orders", JSON.stringify(orders));
        alert("✅ Ordem WR-" + osRes.id + " salva com sucesso na nuvem!");
        renderDashboard(); return;
      }
    } catch(err) { console.warn("Erro ao salvar nuvem:", err); }
  }

  const shortId = getNextShortOrderId();
  orders.push({ id: shortId, name, phone, appliance, brand, serialNumber, sealNumber, problem, photoUrlEntry, status, price, refusalFee, localOnly: true });
  localStorage.setItem("wa_orders", JSON.stringify(orders));
  alert("✅ Ordem " + shortId + " salva localmente!");
  renderDashboard();
}

function editOrder(id) {
  const o = orders.find(item => String(item.id) === String(id));
  if (!o) return;
  const novoPreco = prompt("Digite o valor total do orçamento (R$):", o.price || "");
  if (novoPreco === null) return;
  const novoDiag = prompt("Diagnóstico técnico / O que foi apurado:", o.diagnosis || "");
  if (novoDiag === null) return;

  o.price = parseFloat(novoPreco) || 0;
  o.diagnosis = novoDiag.trim();
  if (o.price > 0 && o.status === "Em análise técnica") o.status = "Aguardando aprovação";

  localStorage.setItem("wa_orders", JSON.stringify(orders));
  if (supabaseClient && o.dbId) {
    supabaseClient.from("ordens_servico").update({ orcamento: o.price, diagnostico: o.diagnosis, status: o.status }).eq("id", o.dbId);
  }
  alert("✅ Orçamento atualizado com sucesso!");
  renderDashboard();
}

function changeOrderStatus(id) {
  const o = orders.find(item => item.id === id);
  if (!o) return;
  const novo = prompt("Novo status:\n1 - Em análise técnica\n2 - Aguardando aprovação\n3 - Aprovado - Conserto iniciado\n4 - Pronto para retirada\n5 - Concluído\n6 - Não aprovado", o.status);
  if (!novo) return;
  if (novo === "1") o.status = "Em análise técnica";
  else if (novo === "2") o.status = "Aguardando aprovação";
  else if (novo === "3") o.status = "Aprovado - Conserto iniciado";
  else if (novo === "4") o.status = "Pronto para retirada";
  else if (novo === "5") { o.status = "Concluído"; o.data_conclusao = new Date().toISOString().split('T')[0]; }
  else if (novo === "6") o.status = "Não aprovado";
  else o.status = novo;

  localStorage.setItem("wa_orders", JSON.stringify(orders));
  if (supabaseClient && o.dbId) {
    supabaseClient.from("ordens_servico").update({ status: o.status, data_conclusao: o.data_conclusao || null }).eq("id", o.dbId);
  }
  renderDashboard();
}

function deleteOrder(id) {
  if (!confirm(`Deseja realmente excluir a ordem ${id}?`)) return;
  const o = orders.find(item => item.id === id);
  orders = orders.filter(item => item.id !== id);
  localStorage.setItem("wa_orders", JSON.stringify(orders));
  if (supabaseClient && o && o.dbId) supabaseClient.from("ordens_servico").delete().eq("id", o.dbId);
  renderDashboard();
}

  modal.innerHTML = `
    <div class="modal-box">
      <h3 style="color:var(--navy); margin-bottom:10px;">⚙️ Configurações da Empresa</h3>
      <div class="field"><label>WhatsApp da Assistência (com DDD)</label><input id="modalPhoneInput" value="${companyWhatsApp}"></div>
      <div class="field"><label>Chave PIX</label><input id="modalPixInput" value="${companyPixKey}"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="secondary" onclick="this.closest('.modal').remove()">Cancelar</button>
        <button class="primary" onclick="saveSettingsModal(this)">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function saveSettingsModal(btn) {
  companyWhatsApp = document.getElementById("modalPhoneInput").value.trim().replace(/\D/g, "");
  companyPixKey = document.getElementById("modalPixInput").value.trim();
  localStorage.setItem("wa_company_phone", companyWhatsApp);
  localStorage.setItem("wa_company_pix", companyPixKey);
  btn.closest('.modal').remove(); renderDashboard(); alert("Configurações salvas!");
}

function changePin() {
  const nova = prompt("Digite a nova senha de acesso:", adminPin);
  if (nova && nova.trim().length >= 4) {
    adminPin = nova.trim(); localStorage.setItem("wa_admin_pin", adminPin); alert("Senha alterada!");
  }
}

function getPublicSiteBaseUrl() {
  return (localStorage.getItem("wa_public_url") || "").trim() || (window.location.origin + window.location.pathname);
}

function getOrderDatabaseId(orderId) {
  const order = orders.find(item => String(item.id) === String(orderId));
  if (!order || order.localOnly || !order.dbId) return null;
  return String(order.dbId);
}

function copyLink(id) {
  const dbId = getOrderDatabaseId(id);
  if (!dbId) return alert("Esta ordem precisa estar salva na nuvem para gerar link público.");
  const url = getPublicSiteBaseUrl().replace(/\/$/, "") + "/#cliente=" + encodeURIComponent(dbId);
  navigator.clipboard.writeText(url).then(() => alert("Link copiado!\n\n" + url));
}

// PÁGINA PÚBLICA DO CLIENTE COM ORÇAMENTO E TAXA DE RECUSA DE R$ 50,00
function renderClientView(id) {
  const app = document.getElementById("app");
  app.innerHTML = '<div style="text-align:center; padding:60px;"><h2>Carregando orçamento...</h2></div>';
  const cleanId = String(id || "").replace(/\D/g, "");
  if (!supabaseClient || !cleanId) {
    app.innerHTML = '<div style="max-width:500px; margin:60px auto; background:#fff; padding:30px; border-radius:14px; text-align:center;"><h2>Ordem indisponível</h2></div>';
    return;
  }

  supabaseClient.from("ordens_servico").select("*, clientes(*)").eq("id", cleanId).single().then(({ data, error }) => {
    if (error || !data) {
      app.innerHTML = '<div style="max-width:500px; margin:60px auto; background:#fff; padding:30px; border-radius:14px; text-align:center;"><h2>Orçamento não localizado</h2></div>';
      return;
    }
    const o = {
      id: "WR-" + data.id, dbId: data.id,
      name: data.clientes ? data.clientes.nome : "Cliente",
      appliance: data.titulo_servico || "Aparelho", brand: data.marca || "",
      problem: data.defeito || data.descricao || "", diagnosis: data.diagnostico || "",
      price: Number(data.orcamento) || 0, refusalFee: Number(data.taxa_recusa) || 50.00,
      entryFee: Number(data.valor_entrada) || 0, photoUrlDefect: data.foto_defeito || data.foto_entrada || "",
      status: data.status || "Aguardando aprovação", dias_garantia: data.dias_garantia || 90
    };
    displayClientOrderPage(o);
  });
}

function displayClientOrderPage(o) {
  const companyPhoneClean = (companyWhatsApp || "").replace(/\D/g, "");
  const contactCompanyBtn = companyPhoneClean ? `<button class="whatsapp-btn" style="width:100%; margin-top:10px; padding:12px; justify-content:center;" onclick="window.open('https://wa.me/55${companyPhoneClean}?text=Olá! Estou visualizando a minha Ordem ${o.id}', '_blank')">💬 Falar com a Assistência no WhatsApp</button>` : '';

  const preco = Number(o.price || 0);
  const taxaRecusa = Number(o.refusalFee || 50.00);
  const fotoHtml = o.photoUrlDefect ? `<div style="margin:16px 0; text-align:center;"><img src="${o.photoUrlDefect}" style="max-width:100%; max-height:280px; border-radius:8px;"></div>` : '';

  const isApproved = String(o.status).toLowerCase().includes("aprovado");
  const isConcluido = String(o.status).toLowerCase().includes("concluído") || String(o.status).toLowerCase().includes("pronto");

  let actionsHtml = '';
  if (isConcluido || isApproved) {
    actionsHtml = `
      <div style="margin-top:20px; background:#d1fae5; border:1px solid #10b981; border-radius:10px; padding:16px; text-align:center;">
        <h3 style="color:#065f46; font-size:16px; margin-bottom:4px;">✅ ${isConcluido ? 'Aparelho Pronto!' : 'Orçamento Aprovado!'}</h3>
        <p style="color:#047857; font-size:14px;">${isConcluido ? 'Seu equipamento está pronto para retirada.' : 'O conserto foi iniciado.'}</p>
      </div>
      ${contactCompanyBtn}`;
  } else {
    actionsHtml = `
      <div style="margin-top:20px; display:grid; gap:10px;">
        <button class="primary" style="width:100%; padding:14px; background:var(--green); font-size:15px;" onclick="clientActionOrder('${o.id}', 'Aprovado - Conserto iniciado', ${o.dbId})">✅ Aprovar Orçamento</button>
        <button class="danger-btn" style="width:100%; padding:12px; font-size:14px;" onclick="clientActionOrder('${o.id}', 'Não aprovado', ${o.dbId})">❌ Não Aprovar (Recusar)</button>
        <p style="font-size:12px; color:var(--muted); text-align:center; margin-top:4px;">* Caso o orçamento não seja aprovado, incide taxa de análise/deslocamento no valor de <strong>${formatBRL(taxaRecusa)}</strong>.</p>
        ${contactCompanyBtn}
      </div>`;
  }

  document.getElementById("app").innerHTML = `
    <header class="top"><div class="brand"><div class="brand-title">WA ❄️ <span style="font-size:15px; font-weight:500;">Acompanhamento Online</span></div></div></header>
    <div style="max-width:600px; margin:20px auto; background:#fff; border-radius:18px; padding:24px; box-shadow:0 10px 30px rgba(0,0,0,0.08);">
      <div style="text-align:center; margin-bottom:16px;">
        <span class="tag ${String(o.status).replace(/\s+/g, '_')}" style="font-size:13px; padding:6px 14px;">Status: ${o.status}</span>
        <h2 style="color:var(--navy); margin-top:8px;">${o.appliance}</h2>
        <p style="color:var(--muted);">Ordem ${o.id} · Cliente: ${o.name}</p>
      </div>
      ${fotoHtml}
      <div style="border-top:1px solid var(--line); padding-top:14px; font-size:14px; line-height:1.6;">
        <p><strong>Defeito relatado:</strong> ${o.problem || 'Não especificado'}</p>
        <p><strong>Diagnóstico técnico:</strong> ${o.diagnosis || 'Em avaliação de bancada'}</p>
        <p style="font-size:18px; margin-top:8px;"><strong>Valor do Orçamento:</strong> <span style="color:var(--green); font-weight:900;">${preco > 0 ? formatBRL(preco) : 'A definir após análise'}</span></p>
      </div>
      ${actionsHtml}
    </div>`;
}

function clientActionOrder(id, newStatus, dbId) {
  const o = orders.find(item => String(item.id) === String(id));
  if (o) {
    o.status = newStatus;
    localStorage.setItem("wa_orders", JSON.stringify(orders));
  }
  if (supabaseClient && dbId) {
    supabaseClient.from("ordens_servico").update({ status: newStatus }).eq("id", dbId).then(() => {
      alert("✅ Resposta registrada com sucesso! Obrigado.");
      renderClientView(dbId);
    });
  } else {
    alert("✅ Resposta registrada com sucesso!");
    location.reload();
  }
}

function sendOrderToClient(clientPhone, orderId, clientName, appliance, price, photoUrl, details) {
  const cleanPhone = (clientPhone || "").replace(/\D/g, "");
  if (!cleanPhone) return alert("Esta ordem não possui WhatsApp cadastrado.");
  const dbId = getOrderDatabaseId(orderId);
  if (!dbId) return alert("Esta ordem precisa estar salva na nuvem para enviar o link.");

  const nomeCliente = decodeURIComponent(clientName);
  const nomeAparelho = decodeURIComponent(appliance);
  const detalhesTxt = decodeURIComponent(details || "");
  const urlOs = getPublicSiteBaseUrl().replace(/\/$/, "") + "/#cliente=" + encodeURIComponent(dbId);

  const texto = `Olá, *${nomeCliente}*! Segue o link de visualização da sua Ordem (*${orderId}*) referente ao conserto do seu(sua) *${nomeAparelho}* na *WA Resolve*:\n\n💰 *Valor:* ${Number(price) > 0 ? formatBRL(price) : 'Em análise'}\n${detalhesTxt ? `🛠️ *Serviço:* ${detalhesTxt}\n` : ''}\n⚠️ *Nota:* Caso o orçamento não seja aprovado, incide taxa de análise no valor de R$ 50,00.\n\n👉 *Clique no link para ver detalhes e aprovar online:*\n${urlOs}`;
  window.open(`https://wa.me/55${cleanPhone}?text=${encodeURIComponent(texto)}`, '_blank');
}

function printOrderSheet(id) {
  const o = orders.find(item => String(item.id) === String(id));
  if (!o) return;
  const pa = document.getElementById("printArea");
  pa.innerHTML = `<div style="font-family:Arial; padding:20px;"><h2>WA RESOLVE - ORDEM ${o.id}</h2><p><strong>Cliente:</strong> ${o.name}</p><p><strong>Aparelho:</strong> ${o.appliance}</p><p><strong>Defeito:</strong> ${o.problem}</p><p><strong>Valor:</strong> ${formatBRL(o.price)}</p><p><strong>Taxa de recusa/análise:</strong> R$ 50,00</p></div>`;
  window.print();
}

function autoFillOrderClient(val) {
  const c = clients.find(x => x.nome && x.nome.toLowerCase() === val.toLowerCase());
  if (c && c.telefone) document.getElementById("osPhone").value = c.telefone;
}
</script>
</body>
</html>
